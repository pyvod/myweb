<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta content="origin" name="referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>学生积分管理系统 · 批量扣分</title>
    <style type="text/css" media="screen">
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #f1f1f1;
            margin: 0;
            padding: 20px 0;
        }
        body, input, button {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .container {
            margin: 20px auto 40px auto;
            width: 90%;
            max-width: 1100px;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            padding: 30px 25px 40px 25px;
            text-align: center;
        }
        h1 {
            color: #2c3e4f;
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        .subhead {
            color: #5a6e7c;
            font-size: 16px;
            border-bottom: 1px solid #eaecef;
            padding-bottom: 18px;
            margin-bottom: 28px;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-bottom: 32px;
            align-items: center;
        }
        .btn {
            display: inline-block;
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 500;
            line-height: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #24292f;
            text-decoration: none;
            box-shadow: 0 1px 0 rgba(0,0,0,0.02);
        }
        .btn-primary {
            background-color: #2c974b;
            border-color: #2c974b;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2a8545;
            border-color: #2a8545;
        }
        .btn-danger {
            background-color: #cf222e;
            border-color: #cf222e;
            color: white;
        }
        .btn-danger:hover {
            background-color: #b71c2a;
            border-color: #b71c2a;
        }
        .btn-outline {
            background-color: #f6f8fa;
            border-color: #d0d7de;
            color: #1f2328;
        }
        .btn-outline:hover {
            background-color: #eef2f5;
            border-color: #c2c9d2;
        }
        .btn:active {
            transform: translateY(1px);
        }
        .stats-card {
            background-color: #f8f9fc;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 28px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #e9ecef;
            font-size: 14px;
            color: #2c3e4f;
        }
        .stat-item {
            background: white;
            padding: 6px 14px;
            border-radius: 40px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.03);
        }
        .stat-label {
            font-weight: 500;
            margin-right: 6px;
            color: #4a6272;
        }
        .stat-number {
            font-weight: 700;
            color: #1f6feb;
            font-size: 18px;
        }
        .student-table-wrapper {
            overflow-x: auto;
            margin-top: 5px;
            border-radius: 12px;
            border: 1px solid #eef2f6;
            background: white;
        }
        .student-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            min-width: 380px;
        }
        .student-table th {
            background-color: #f6f8fa;
            color: #2c3e4f;
            font-weight: 600;
            padding: 14px 12px;
            border-bottom: 1px solid #e1e4e8;
            text-align: center;
        }
        .student-table td {
            padding: 12px 12px;
            border-bottom: 1px solid #eef2f6;
            text-align: center;
            color: #1f2328;
        }
        .student-table tr:last-child td {
            border-bottom: none;
        }
        .score-value {
            font-weight: 700;
            font-size: 18px;
            color: #2c974b;
            background: #f0fff4;
            display: inline-block;
            padding: 2px 12px;
            border-radius: 40px;
        }
        .score-negative {
            color: #cf222e;
            background: #fff0f0;
        }
        .message-area {
            margin-top: 28px;
            padding: 12px 18px;
            background-color: #f8fafc;
            border-radius: 10px;
            font-size: 14px;
            color: #2c3e4f;
            border-left: 4px solid #2c974b;
            text-align: left;
            word-break: break-word;
        }
        .message-error {
            border-left-color: #cf222e;
            background-color: #fff5f5;
        }
        .footer-note {
            margin-top: 28px;
            font-size: 12px;
            color: #7c8b9a;
            border-top: 1px solid #eaeef2;
            padding-top: 20px;
        }
        @media (max-width: 680px) {
            .container {
                padding: 20px 18px;
            }
            .btn {
                padding: 6px 14px;
                font-size: 13px;
            }
            .stat-item {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 学生积分管理系统</h1>
    <div class="subhead">批量积分管理 · 快速扣分操作</div>

    <!-- 批量操作栏：完全移除抽奖/奖品兑换相关按钮 -->
    <div class="toolbar">
        <button id="batchMinus1Btn" class="btn btn-danger">🔻 全体学生 –1 分</button>
        <button id="batchMinus2Btn" class="btn btn-danger">🔻 全体学生 –2 分</button>
        <button id="resetBtn" class="btn btn-outline">⟳ 重置积分 (恢复默认)</button>
    </div>

    <!-- 统计卡片 展示学生总人数及总分/平均分 -->
    <div class="stats-card" id="statsPanel">
        <div class="stat-item"><span class="stat-label">👨‍🎓 学生总数</span><span class="stat-number" id="totalCount">0</span></div>
        <div class="stat-item"><span class="stat-label">⭐ 总积分</span><span class="stat-number" id="totalScore">0</span></div>
        <div class="stat-item"><span class="stat-label">📊 平均分</span><span class="stat-number" id="avgScore">0</span></div>
        <div class="stat-item"><span class="stat-label">🔻 最低积分</span><span class="stat-number" id="minScore">0</span></div>
    </div>

    <!-- 学生列表表格 -->
    <div class="student-table-wrapper">
        <table class="student-table" id="studentTable">
            <thead>
                <tr>
                    <th>#</th>
                    <th>学生姓名</th>
                    <th>当前积分</th>
                </tr>
            </thead>
            <tbody id="studentTableBody">
                <!-- 动态渲染学生数据 -->
                <tr><td colspan="3" style="text-align:center;">加载中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 操作消息反馈区域 -->
    <div id="messageBox" class="message-area">
        ✅ 系统就绪，可对全体学生批量扣除1分或2分。
    </div>
    <div class="footer-note">
        ※ 批量扣分下限为0分（积分不会低于0），每次操作均会提示详细结果。
    </div>
</div>

<script>
    // ---------- 学生初始数据 (完全无抽奖/奖品兑换相关属性) ----------
    const DEFAULT_STUDENTS = [
        { id: 1, name: '陈思琪', score: 95 },
        { id: 2, name: '李铭宇', score: 82 },
        { id: 3, name: '王语嫣', score: 78 },
        { id: 4, name: '赵子恒', score: 100 },
        { id: 5, name: '周小彤', score: 67 },
        { id: 6, name: '吴子涵', score: 88 },
        { id: 7, name: '郑子琪', score: 74 },
        { id: 8, name: '林俊辉', score: 91 }
    ];

    // 全局学生数组 (实时变动)
    let students = [];

    // ---------- 辅助函数 ----------
    // 深拷贝默认数据
    function loadDefaultData() {
        return DEFAULT_STUDENTS.map(s => ({ ...s, score: s.score }));
    }

    // 更新统计信息 (总人数，总分，平均分，最低分)
    function updateStatistics() {
        const totalCount = students.length;
        if (totalCount === 0) {
            document.getElementById('totalCount').innerText = '0';
            document.getElementById('totalScore').innerText = '0';
            document.getElementById('avgScore').innerText = '0';
            document.getElementById('minScore').innerText = '0';
            return;
        }
        let totalScore = 0;
        let minScore = Infinity;
        for (let s of students) {
            totalScore += s.score;
            if (s.score < minScore) minScore = s.score;
        }
        const avg = (totalScore / totalCount).toFixed(1);
        document.getElementById('totalCount').innerText = totalCount;
        document.getElementById('totalScore').innerText = totalScore;
        document.getElementById('avgScore').innerText = avg;
        document.getElementById('minScore').innerText = minScore === Infinity ? 0 : minScore;
    }

    // 显示消息 (支持普通和错误样式)
    function showMessage(text, isError = false) {
        const msgDiv = document.getElementById('messageBox');
        msgDiv.innerText = text;
        if (isError) {
            msgDiv.classList.add('message-error');
        } else {
            msgDiv.classList.remove('message-error');
        }
        // 3秒后恢复普通样式（但保留消息内容，不清空，方便查看）
        setTimeout(() => {
            if (!isError) {
                // 仅移除错误样式，不清空内容
                msgDiv.classList.remove('message-error');
            } else {
                // 对于错误消息，3秒后移除红边但保留文本，以免闪烁频繁
                msgDiv.classList.remove('message-error');
            }
        }, 2800);
    }

    // 渲染学生表格 (完全移除抽奖、奖品兑换任何相关UI)
    function renderStudentTable() {
        const tbody = document.getElementById('studentTableBody');
        if (!tbody) return;
        if (!students.length) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">暂无学生数据</td></tr>';
            updateStatistics();
            return;
        }

        let html = '';
        students.forEach((student, idx) => {
            // 积分样式：若为0分则浅红色背景提示，但功能上只是视觉提醒
            const scoreVal = student.score;
            const scoreClass = scoreVal === 0 ? 'score-value score-negative' : 'score-value';
            html += `
                <tr>
                    <td style="font-weight: 500; color:#586069;">${idx + 1}</td>
                    <td style="font-weight: 500;">${escapeHtml(student.name)}</td>
                    <td><span class="${scoreClass}">${scoreVal}</span> 分</td>
                </tr>
            `;
        });
        tbody.innerHTML = html;
        // 更新统计卡片
        updateStatistics();
    }

    // 简单防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
            return c;
        });
    }

    // 核心功能: 批量扣除所有学生指定分数 (不涉及任何抽奖/兑换)
    // 参数: pointsToDeduct (正数, 表示扣除的分值, 例如1或2)
    // 返回值: { success: boolean, totalDeducted: number, zeroReachCount: number, message: string }
    function batchDeductPoints(pointsToDeduct) {
        if (!students || students.length === 0) {
            return { success: false, totalDeducted: 0, zeroReachCount: 0, message: '没有学生数据，无法执行批量扣分。' };
        }
        if (pointsToDeduct <= 0) {
            return { success: false, totalDeducted: 0, zeroReachCount: 0, message: '扣分值必须为正数。' };
        }

        let totalDeductedSum = 0;     // 实际总共扣除的总分 (差值累计)
        let zeroReachCount = 0;       // 本次操作触及0分(已经是0或者扣减后变成0)的学生数量
        let beforeScores = students.map(s => s.score); // 记录扣分前用于计算差值

        // 执行扣分 (保证最低0分)
        for (let i = 0; i < students.length; i++) {
            const oldScore = students[i].score;
            let newScore = oldScore - pointsToDeduct;
            let deductedAmount = pointsToDeduct;
            if (newScore < 0) {
                newScore = 0;
                deductedAmount = oldScore;   // 实际只能扣除剩余分数
            }
            students[i].score = newScore;
            // 累计实际扣除积分
            totalDeductedSum += (oldScore - newScore);
            // 如果扣分后等于0 或 扣分前已经是0且本次扣除后仍是0，都算触及0分状态（学生积分到达下限）
            if (newScore === 0) {
                zeroReachCount++;
            }
        }

        // 生成反馈消息
        const successMsg = `✅ 批量扣除 ${pointsToDeduct} 分操作完成！共实际扣除 ${totalDeductedSum} 分。${zeroReachCount > 0 ? `其中 ${zeroReachCount} 名学生积分已达0分下限。` : '所有学生积分均未低于0分。'}`;
        return { success: true, totalDeducted: totalDeductedSum, zeroReachCount, message: successMsg };
    }

    // 批量扣1分 (带确认)
    function handleBatchMinus1() {
        const confirmMsg = `⚠️ 确认对所有 ${students.length} 名学生批量扣除 1 分吗？\n积分最低为0分，不会出现负数。`;
        if (!confirm(confirmMsg)) {
            showMessage('⏸ 已取消批量扣1分操作', false);
            return;
        }
        const result = batchDeductPoints(1);
        if (result.success) {
            renderStudentTable();
            showMessage(result.message, false);
        } else {
            showMessage(`❌ 操作失败: ${result.message}`, true);
        }
    }

    // 批量扣2分 (带确认)
    function handleBatchMinus2() {
        const confirmMsg = `⚠️ 确认对所有 ${students.length} 名学生批量扣除 2 分吗？\n积分最低为0分，不会出现负数。`;
        if (!confirm(confirmMsg)) {
            showMessage('⏸ 已取消批量扣2分操作', false);
            return;
        }
        const result = batchDeductPoints(2);
        if (result.success) {
            renderStudentTable();
            showMessage(result.message, false);
        } else {
            showMessage(`❌ 操作失败: ${result.message}`, true);
        }
    }

    // 重置所有学生积分至初始值 (无任何抽奖/奖品相关)
    function resetScores() {
        const confirmReset = confirm('🔄 重置所有学生积分到初始值，确认继续吗？');
        if (!confirmReset) {
            showMessage('重置操作已取消', false);
            return;
        }
        students = loadDefaultData();
        renderStudentTable();
        showMessage('✨ 积分已重置为初始状态，所有学生恢复原始分数。', false);
    }

    // ---------- 初始化页面, 绑定事件, 移除一切抽奖/兑换痕迹 ----------
    function init() {
        // 载入默认学生数据
        students = loadDefaultData();
        // 渲染表格
        renderStudentTable();
        // 绑定批量扣分按钮 & 重置按钮
        const minus1Btn = document.getElementById('batchMinus1Btn');
        const minus2Btn = document.getElementById('batchMinus2Btn');
        const resetBtn = document.getElementById('resetBtn');

        if (minus1Btn) minus1Btn.addEventListener('click', handleBatchMinus1);
        if (minus2Btn) minus2Btn.addEventListener('click', handleBatchMinus2);
        if (resetBtn) resetBtn.addEventListener('click', resetScores);

        // 额外保证没有任何隐藏的抽奖或奖品兑换相关dom残留 (安全起见检查并移除可能的内嵌)
        // 通过代码确保移除任何潜在的抽奖字样或者奖品dom（根据需求，当前页面无任何抽奖/兑换元素，但加强排查）
        const allElements = document.querySelectorAll('*');
        for (let el of allElements) {
            // 如果任何元素的文本或者属性包含抽奖/奖品/兑换字样(且不是必要的说明文字)，但为了避免误伤仅在控制台提醒，
            // 且我们构建的页面中没有任何抽奖功能，但需求是去掉原有功能，现在全新实现已完全剔除
            if (el.tagName === 'BUTTON' || el.tagName === 'A' || el.tagName === 'DIV') {
                const text = el.innerText || '';
                if ((text.includes('抽奖') || text.includes('奖品') || text.includes('兑换')) && 
                    (el.id !== 'messageBox' && !el.classList?.contains('footer-note'))) {
                    // 这种理论上不可能出现，因为本页面未添加任何抽奖逻辑，但是若不小心遗留则隐藏或移除，保证干净
                    console.warn('检测到可能遗留抽奖/兑换词汇，为确保安全已移除:', text);
                    if (el.parentNode) el.parentNode.removeChild(el);
                }
            }
        }

        // 设置初始欢迎消息
        showMessage('🎓 学生积分系统已启动 | 批量扣分模块可用 | 无抽奖/兑换模块', false);
    }

    // 页面加载完成执行
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
</script>
</body>
</html>
