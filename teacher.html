<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瓶窑第一中学班级作业管理系统 - 教师端</title>
    <style>
        /* 保持所有其他样式不变，只修改班级选择部分 */
        
        /* 班级选择样式 - 改为复选框形式 */
        .class-selection-container {
            margin: 15px 0;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 15px;
            background: #f8f9fa;
        }

        .class-selection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: nowrap;
        }

        .header-box {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-all-box {
            justify-content: flex-start;
            min-width: 140px;
            flex-shrink: 0;
        }

        .selected-stats-box {
            justify-content: flex-end;
            text-align: right;
            min-width: 140px;
            flex-shrink: 0;
        }

        .header-box label {
            margin: 0;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
            font-size: 14px;
        }

        .header-box .selected-stats {
            margin: 0;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            font-size: 14px;
        }

        .header-box input[type="checkbox"] {
            margin: 0;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .class-grid-container {
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            background: white;
            padding: 10px;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 8px;
        }

        .class-item-compact {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            background: white;
            transition: all 0.2s ease;
            cursor: pointer;
            min-height: 44px;
        }

        .class-item-compact:hover {
            border-color: #3498db;
            background: #f8fafc;
        }

        .class-item-compact.selected {
            border-color: #3498db;
            background: #e3f2fd;
        }

        .class-item-compact input {
            margin-right: 10px;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }

        .class-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            overflow: hidden;
        }

        .class-name-main {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            display: block;
            width: 100%;
        }

        .class-status-row {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 16px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #28a745;
        }

        .status-dot.offline {
            background: #dc3545;
        }

        .status-text {
            font-size: 11px;
            color: #6c757d;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 其他原有样式保持不变 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            max-width: 400px;
            width: 100%;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-header {
            margin-bottom: 30px;
        }

        .login-header h1 {
            font-size: 1.8em;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .login-header .subtitle {
            color: #7f8c8d;
            font-size: 1em;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin: 30px 0;
        }

        .login-input {
            padding: 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
            width: 100%;
        }

        .login-input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0,123,255,0.1);
        }

        .login-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.1em;
            font-weight: bold;
            transition: all 0.3s ease;
            width: 100%;
        }

        .login-btn:hover {
            background: #0056b3;
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-status {
            color: #dc3545;
            margin-top: 15px;
            min-height: 20px;
            font-size: 0.9em;
        }

        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .app-container {
            display: none;
            max-width: 1200px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #e74c3c);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 12px 25px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sync-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-announcement {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .content {
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
            min-height: 600px;
        }

        .editor-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .preview-section {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            max-height: 800px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        .subject-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 15px;
        }

        .subject-btn {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            font-weight: bold;
        }

        .subject-btn.active {
            border-color: #007bff;
            background: #007bff;
            color: white;
        }

        .editor-container {
            margin-bottom: 20px;
        }

        .editor-label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2c3e50;
        }

        .homework-editor {
            width: 100%;
            height: 250px;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            font-size: 1em;
            line-height: 1.5;
            resize: vertical;
            transition: border-color 0.3s ease;
        }

        .homework-editor:focus {
            outline: none;
            border-color: #007bff;
        }

        .preview-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 15px;
            border-left: 5px solid #3498db;
            transition: all 0.3s ease;
        }

        .preview-card:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 12px rgba(0,0,0,0.15);
        }

        .preview-header {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 12px;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .preview-header h3 {
            font-size: 1.1em;
            margin: 0;
        }

        .preview-content {
            padding: 15px;
            min-height: 60px;
        }

        .preview-text {
            font-size: 1em;
            line-height: 1.5;
            color: #2c3e50;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .empty-preview {
            color: #7f8c8d;
            font-style: italic;
            text-align: center;
            padding: 15px;
        }

        .last-updated {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-top: 15px;
            text-align: center;
            color: #6c757d;
            font-size: 0.9em;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #28a745;
            color: white;
            border-radius: 6px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
            transform: translateX(400px);
            transition: transform 0.3s ease;
            z-index: 1000;
            max-width: 350px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc3545;
        }

        .notification.warning {
            background: #ffc107;
            color: #212529;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #2c3e50;
            text-align: center;
        }

        .config-form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-weight: bold;
            color: #2c3e50;
        }

        .form-input {
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 0.95em;
            transition: border-color 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #007bff;
        }

        .form-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 15px;
        }

        .modal-tabs {
            display: flex;
            border-bottom: 2px solid #e9ecef;
            margin-bottom: 15px;
        }

        .modal-tab {
            padding: 8px 16px;
            background: #f8f9fa;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .modal-tab.active {
            background: white;
            border-bottom-color: #007bff;
            color: #007bff;
        }

        .modal-tab-content {
            display: none;
        }

        .modal-tab-content.active {
            display: block;
        }

        .link-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .generated-link {
            margin-top: 12px;
            padding: 12px;
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 6px;
            display: none;
        }

        .link-text {
            word-break: break-all;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2e7d32;
            font-size: 0.9em;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .preview-section {
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .status-bar {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            
            .subject-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .controls {
                justify-content: center;
            }
            
            .action-buttons {
                justify-content: center;
            }
            
            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-container">
        <div class="login-header">
            <h1>瓶窑第一中学作业管理系统</h1>
            <div class="subtitle">教师端 - 请登录</div>
        </div>
        
        <form class="login-form" id="loginForm">
            <input type="text" class="login-input" id="username" placeholder="用户名" required>
            <input type="password" class="login-input" id="password" placeholder="密码" required>
            <button type="submit" class="login-btn" id="loginBtn">登录</button>
        </form>
        
        <div class="login-status" id="loginStatus"></div>
    </div>

    <!-- 主应用页面 -->
    <div id="appPage" class="app-container">
        <div class="header">
            <h1>瓶窑第一中学作业管理系统</h1>
            <div class="subtitle">教师端 - <span id="userInfo">欢迎</span></div>
        </div>

        <div class="status-bar">
            <div class="sync-status">
                <div class="sync-indicator"></div>
                <span id="syncStatus">正在连接云端...</span>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="loadHomeworkData()">
                    📥 加载作业
                </button>
                <button class="btn btn-success" onclick="saveAll()">
                    💾 保存全部
                </button>
                <button class="btn btn-info" onclick="showConfigModal()">
                    ⚙️ 系统设置
                </button>
                <a class="btn btn-announcement" href="http://10.59.14.251:5000" target="_blank">
                    📢 教师喊话
                </a>
                <button class="btn btn-warning" onclick="logout()">
                    🚪 退出登录
                </button>
            </div>
        </div>

        <div class="content">
            <div class="editor-section">
                <h2 class="section-title">作业编辑</h2>
                
                <!-- 班级选择区域 - 改为复选框形式 -->
                <div class="class-selection-container">
                    <div class="class-selection-header">
                        <div class="header-box select-all-box">
                            <input type="checkbox" id="selectAll" onchange="toggleAllClasses()">
                            <label for="selectAll">所有班级</label>
                        </div>
                        <div class="header-box selected-stats-box">
                            <div class="selected-stats" id="selectedStats">
                                已选择: 0 个班级
                            </div>
                        </div>
                    </div>
                    
                    <div class="class-grid-container">
                        <div class="class-grid" id="classGrid">
                            <div class="empty-state">正在加载班级列表...</div>
                        </div>
                    </div>
                </div>

                <!-- 科目选择区域 -->
                <div class="subject-selector">
                    <h3>选择科目：</h3>
                    <div class="subject-buttons" id="subjectButtons">
                        <!-- 科目按钮将通过JavaScript动态生成 -->
                    </div>
                </div>

                <!-- 作业编辑区域 -->
                <div class="editor-container">
                    <label class="editor-label" id="editorLabel">语文作业内容：</label>
                    <textarea 
                        class="homework-editor" 
                        id="homeworkEditor"
                        placeholder="请输入作业内容...（支持多行输入）"
                    ></textarea>
                </div>

                <!-- 操作按钮区域 -->
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="saveCurrent()">
                        💾 保存当前科目
                    </button>
                    <button class="btn btn-warning" onclick="copyToAllClasses()">
                        📋 复制到同年级所有班级
                    </button>
                    <button class="btn btn-danger" onclick="clearCurrent()">
                        🗑️ 清空当前科目
                    </button>
                </div>
            </div>

            <div class="preview-section">
                <h2 class="section-title">实时预览</h2>
                <div id="previewContainer">
                    <!-- 预览内容将通过JavaScript动态生成 -->
                </div>
                <div class="last-updated" id="lastUpdated">
                    <!-- 最后更新时间 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 通知消息和模态框 -->
    <div class="notification" id="notification"></div>
    <div class="modal" id="configModal">
        <div class="modal-content">
            <h3 class="modal-title">系统设置</h3>
            
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="storage">云存储设置</button>
                <button class="modal-tab" data-tab="links">班级链接生成</button>
            </div>
            
            <!-- 云存储设置标签页 -->
            <div class="modal-tab-content active" id="storageTab">
                <div class="config-form">
                    <div class="form-group">
                        <label class="form-label">腾讯云 SecretId</label>
                        <input type="text" class="form-input" id="secretId" 
                               placeholder="请输入SecretId">
                    </div>
                    <div class="form-group">
                        <label class="form-label">腾讯云 SecretKey</label>
                        <input type="password" class="form-input" id="secretKey" 
                               placeholder="请输入SecretKey">
                    </div>
                    <div class="form-group">
                        <label class="form-label">存储桶名称</label>
                        <input type="text" class="form-input" id="cosBucket" 
                               value="class-homework-1257663765" readonly>
                    </div>
                    <div class="form-group">
                        <label class="form-label">地域</label>
                        <input type="text" class="form-input" id="cosRegion" 
                               value="ap-beijing" readonly>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-warning" onclick="testConnection()">
                            🔍 测试连接
                        </button>
                        <button class="btn btn-success" onclick="saveConfig()">
                            💾 保存配置
                        </button>
                        <button class="btn btn-danger" onclick="hideConfigModal()">
                            ❌ 取消
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 班级链接生成标签页 -->
            <div class="modal-tab-content" id="linksTab">
                <div class="config-form">
                    <div class="form-group">
                        <label class="form-label">选择年级和班级生成家长端链接：</label>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <select class="form-input" id="linkGrade" style="flex: 1;">
                                <option value="初一">初一年级</option>
                                <option value="初二">初二年级</option>
                                <option value="初三">初三年级</option>
                            </select>
                            <select class="form-input" id="linkClass" style="flex: 1;">
                                <!-- 班级选项动态生成 -->
                            </select>
                        </div>
                    </div>
                    <div class="link-controls">
                        <button class="btn btn-success" onclick="generateClassLink()">
                            🔗 生成班级链接
                        </button>
                        <button class="btn btn-info" onclick="generateAllClassLinks()">
                            📋 生成所有班级链接
                        </button>
                    </div>
                    <div class="generated-link" id="generatedLink">
                        <div class="link-text" id="classLinkText"></div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-success" onclick="copyClassLink()">
                                📋 复制链接
                            </button>
                            <button class="btn btn-primary" onclick="testClassLink()">
                                🔍 测试链接
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // SHA256 哈希函数 - 与喊话系统相同
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        // 用户登录
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('loginStatus');
            const loginBtn = document.getElementById('loginBtn');
            
            if (!username || !password) {
                statusDiv.textContent = '请输入用户名和密码';
                return;
            }
            
            loginBtn.disabled = true;
            loginBtn.textContent = '登录中...';
            statusDiv.textContent = '';
            
            try {
                const usersData = await loadUsersDataFromCOS();
                
                if (!usersData || !usersData.users) {
                    statusDiv.textContent = '加载用户数据失败，请检查网络连接';
                    return;
                }
                
                const allUsers = Object.values(usersData.users);
                const user = allUsers.find(u => u.username === username);
                
                if (!user) {
                    statusDiv.textContent = '用户不存在';
                    return;
                }
                
                if (user.status !== 'approved' && user.role !== 'super_admin') {
                    statusDiv.textContent = '用户注册申请正在审核中，请等待管理员审核';
                    return;
                }
                
                const inputHash = await sha256(password);
                if (inputHash !== user.password) {
                    statusDiv.textContent = '密码错误';
                    return;
                }
                
                currentUser = {
                    username: user.username,
                    real_name: user.real_name,
                    role: user.role,
                    classes: user.classes || []
                };
                
                userClasses = currentUser.classes;
                
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                
                showAppPage();
                
            } catch (error) {
                console.error('登录错误:', error);
                statusDiv.textContent = '登录失败: ' + error.message;
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = '登录';
            }
        }

        // 保存所有内容
        async function saveAll() {
            if (!homeworkData) return;
            
            const selectedClasses = getSelectedClasses();
            if (selectedClasses.length === 0) {
                showNotification('请选择要保存的班级', 'error');
                return;
            }
            
            const content = document.getElementById('homeworkEditor').value.trim();
            if (!content) {
                showNotification('请输入作业内容', 'error');
                return;
            }
            
            // 保存到所有选中的班级
            selectedClasses.forEach(className => {
                const [grade, classNum] = parseClassName(className);
                
                // 确保数据结构存在
                if (!homeworkData[grade]) {
                    homeworkData[grade] = {};
                }
                if (!homeworkData[grade][classNum]) {
                    homeworkData[grade][classNum] = {};
                }
                
                homeworkData[grade][classNum][currentSubject] = content || '暂无作业';
                homeworkData[grade][classNum].last_updated = new Date().toLocaleString('zh-CN');
            });
            
            updatePreview();
            
            // 先保存到本地
            localStorage.setItem('homeworkData', JSON.stringify(homeworkData));
            
            // 然后尝试上传到云端
            updateSyncStatus('正在上传到云端...');
            
            try {
                const result = await uploadToCOS(homeworkData);
                
                if (result.success) {
                    updateSyncStatus('云端保存成功');
                    showNotification(`作业已保存到 ${selectedClasses.length} 个班级的本地和云端！`, 'success');
                } else {
                    updateSyncStatus('云端保存失败，已保存到本地');
                    showNotification('作业已保存到本地，但云端上传失败: ' + result.message, 'warning');
                }
            } catch (error) {
                updateSyncStatus('云端保存失败，已保存到本地');
                showNotification('作业已保存到本地，但云端上传失败: ' + error.message, 'warning');
            }

                    return { success: true, message: '直接上传成功' };

                    return { success: false, message: `上传失败: ${response.status}` };

            let html = '';
            
            if (selectedClasses.length === 0) {
                html = '<div class="empty-preview">请选择班级查看作业预览</div>';
            } else {
                // 显示第一个选中的班级的预览
                const firstClass = selectedClasses[0];
                const [grade, classNum] = parseClassName(firstClass);
                
                if (homeworkData[grade] && homeworkData[grade][classNum]) {
                    const classData = homeworkData[grade][classNum];
                    
                    subjects.forEach(subject => {
                        const content = classData[subject.id] || '暂无内容';
                        const isEmpty = !content || content === '暂无作业' || content === '暂无晨读任务';
                        
                        html += `
                            <div class="preview-card">
                                <div class="preview-header">
                                    <h3>${subject.name}</h3>
                                    <span class="preview-class">${firstClass}</span>
                                </div>
                                <div class="preview-content">
                                    ${isEmpty ? 
                                        `<div class="empty-preview">${subject.id === '晨读' ? '暂无晨读任务' : '暂无作业'}</div>` :
                                        `<div class="preview-text">${escapeHtml(content)}</div>`
                                    }
                                </div>
                            </div>
                        `;
                    });
                } else {
                    html = `<div class="empty-preview">${firstClass}暂无数据</div>`;
                }
            }
            
            container.innerHTML = html;
            
            // 更新最后更新时间
            if (selectedClasses.length > 0) {
                const firstClass = selectedClasses[0];
                const [grade, classNum] = parseClassName(firstClass);
                
                if (homeworkData[grade] && homeworkData[grade][classNum]) {
                    document.getElementById('lastUpdated').textContent =

                }
            } else {
                document.getElementById('lastUpdated').textContent = '最后更新: 请选择班级';
            }
        }

            showNotification('配置已保存', 'success');
        }

        function showConfigModal() {
            document.getElementById('secretId').value = config.secretId;
            document.getElementById('secretKey').value = config.secretKey;
            document.getElementById('configModal').classList.add('show');
        }

        function hideConfigModal() {
            document.getElementById('configModal').classList.remove('show');
        }

        async function testConnection() {
            try {
                showNotification('正在测试连接...', 'warning');
                
                const response = await fetch(
                    `https://${config.bucket}.cos.${config.region}.myqcloud.com/homework_data.json`,
                    {
                        method: 'HEAD',
                        mode: 'cors'
                    }
                );
                
                if (response.status === 200 || response.status === 404) {
                    showNotification('连接测试成功！存储桶可访问', 'success');
                } else {
                    showNotification(`连接测试失败: ${response.status}`, 'error');
                }
            } catch (error) {
                showNotification('连接测试失败: ' + error.message, 'error');
            }
        }

        // 工具函数
        function showLoading() {
            updateSyncStatus('加载中...');
        }

        function hideLoading() {
            // 状态会在具体操作中更新
        }

        function updateSyncStatus(message) {
            document.getElementById('syncStatus').textContent = message;
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification';
            notification.classList.add(type);
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key === 's') {
                event.preventDefault();
                saveAll();
            }
        });

        console.log('作业管理系统已初始化完成');
    </script>
</body>
</html>
