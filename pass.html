<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>照片审核系统</title>
    <style>
        :root {
            --primary-color: #006eff;
            --success-color: #07c160;
            --danger-color: #ee0a24;
            --warning-color: #ff976a;
            --bg-color: #f7f8fa;
            --card-color: #ffffff;
            --text-color: #323233;
            --border-color: #ebedf0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, var(--primary-color), #0051d4);
            color: white;
            border-radius: 12px;
        }
        
        .header h1 {
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-pending { color: var(--warning-color); }
        .stat-approved { color: var(--success-color); }
        .stat-total { color: var(--primary-color); }
        
        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
        }
        
        .filter-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .filter-btn.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: white;
        }
        
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .photo-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        
        .photo-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }
        
        .photo-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f5f5f5;
        }
        
        .photo-info {
            padding: 15px;
        }
        
        .photo-name {
            font-weight: 600;
            margin-bottom: 5px;
            word-break: break-all;
        }
        
        .photo-meta {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }
        
        .photo-status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: 500;
        }
        
        .status-pending {
            background: #fff7e6;
            color: #fa8c16;
        }
        
        .status-approved {
            background: #f6ffed;
            color: #52c41a;
        }
        
        .photo-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.3s;
            flex: 1;
            text-align: center;
        }
        
        .btn-approve {
            background: var(--success-color);
            color: white;
        }
        
        .btn-approve:hover {
            background: #06ae56;
        }
        
        .btn-reject {
            background: var(--danger-color);
            color: white;
        }
        
        .btn-reject:hover {
            background: #d81e06;
        }
        
        .btn:disabled {
            background: #c8c9cc;
            cursor: not-allowed;
        }
        
        .message {
            padding: 15px;
            border-radius: 6px;
            margin: 10px 0;
            text-align: center;
        }
        
        .message.success {
            background-color: #f6ffed;
            border: 1px solid #b7eb8f;
            color: #52c41a;
        }
        
        .message.error {
            background-color: #fff2f0;
            border: 1px solid #ffccc7;
            color: #ff4d4f;
        }
        
        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #969799;
        }
        
        .empty-state img {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.5;
        }
        
        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 照片审核系统</h1>
            <p>审核待处理照片，管理已审核内容</p>
        </div>
        
        <div id="messageArea"></div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number stat-pending" id="pendingCount">0</div>
                <div>待审核</div>
            </div>
            <div class="stat-card">
                <div class="stat-number stat-approved" id="approvedCount">0</div>
                <div>已审核</div>
            </div>
            <div class="stat-card">
                <div class="stat-number stat-total" id="totalCount">0</div>
                <div>总计</div>
            </div>
        </div>
        
        <div class="filters">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">全部照片</button>
                <button class="filter-btn" data-filter="pending">待审核</button>
                <button class="filter-btn" data-filter="approved">已审核</button>
            </div>
        </div>
        
        <div class="photo-grid" id="photoGrid">
            <!-- 照片卡片将在这里动态生成 -->
        </div>
        
        <div class="empty-state" id="emptyState" style="display: none;">
            <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23969979' d='M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM5 4.5h14c.3 0 .5.2.5.5v8.4l-3-2.9c-.3-.3-.8-.3-1.1 0L11.9 14 9 11.5c-.3-.2-.7-.2-1 0L5.5 13V5c0-.3.2-.5.5-.5zm14 15H5c-.3 0-.5-.2-.5-.5v-2.4l4.1-3.8 2.8 2.1c.3.2.7.2 1 0l4.1-3.2 4.1 3.9V19c0 .3-.2.5-.5.5z'/%3E%3C/svg%3E" alt="No photos">
            <h3>暂无照片</h3>
            <p>当前筛选条件下没有照片</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5/dist/cos-js-sdk-v5.min.js"></script>
    <script>
        // COS配置
        const COS_CONFIG = {
            SecretId: 'AKIDXsyve7LJ4bu0wc4GExue8PRDvOcaIm36',
            SecretKey: 'tXw61g5FBsKZYIm10jDTYO4UfaGgqlQp',
            Bucket: 'class-homework-1257663765',
            Region: 'ap-beijing'
        };

        // 全局变量
        let cosClient = null;
        let allPhotos = [];
        let currentFilter = 'all';

        // 显示消息
        function showMessage(message, type = 'success') {
            const messageArea = document.getElementById('messageArea');
            messageArea.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            setTimeout(() => {
                messageArea.innerHTML = '';
            }, 5000);
        }

        // 初始化COS客户端
        function initCOSClient() {
            try {
                cosClient = new COS({
                    SecretId: COS_CONFIG.SecretId,
                    SecretKey: COS_CONFIG.SecretKey
                });
                console.log('COS客户端初始化成功');
                return true;
            } catch (error) {
                console.error('COS客户端初始化失败:', error);
                showMessage('COS客户端初始化失败', 'error');
                return false;
            }
        }

        // 加载照片记录
        async function loadPhotoRecords() {
            if (!cosClient) {
                showMessage('COS客户端未初始化', 'error');
                return;
            }

            try {
                const recordResponse = await new Promise((resolve, reject) => {
                    cosClient.getObject({
                        Bucket: COS_CONFIG.Bucket,
                        Region: COS_CONFIG.Region,
                        Key: 'photo_records.json'
                    }, (err, data) => {
                        if (err) reject(err);
                        else resolve(data);
                    });
                });

                const recordText = recordResponse.Body.toString();
                allPhotos = JSON.parse(recordText);
                updateStats();
                renderPhotoGrid();
                
            } catch (error) {
                console.error('加载记录文件失败:', error);
                if (error.statusCode === 404) {
                    showMessage('记录文件不存在，请先上传照片', 'error');
                } else {
                    showMessage('加载记录文件失败', 'error');
                }
            }
        }

        // 更新统计信息
        function updateStats() {
            const pendingCount = allPhotos.filter(photo => photo.status === 'pending').length;
            const approvedCount = allPhotos.filter(photo => photo.status === 'approved').length;
            const totalCount = allPhotos.length;

            document.getElementById('pendingCount').textContent = pendingCount;
            document.getElementById('approvedCount').textContent = approvedCount;
            document.getElementById('totalCount').textContent = totalCount;
        }

        // 渲染照片网格
        function renderPhotoGrid() {
            const photoGrid = document.getElementById('photoGrid');
            const emptyState = document.getElementById('emptyState');
            
            // 过滤照片
            let filteredPhotos = allPhotos;
            if (currentFilter === 'pending') {
                filteredPhotos = allPhotos.filter(photo => photo.status === 'pending');
            } else if (currentFilter === 'approved') {
                filteredPhotos = allPhotos.filter(photo => photo.status === 'approved');
            }

            if (filteredPhotos.length === 0) {
                photoGrid.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';
            photoGrid.innerHTML = '';

            filteredPhotos.forEach((photo, index) => {
                const photoCard = createPhotoCard(photo, index);
                photoGrid.appendChild(photoCard);
            });
        }

        // 创建照片卡片
        function createPhotoCard(photo, index) {
            const card = document.createElement('div');
            card.className = 'photo-card';
            card.innerHTML = `
                <img src="${photo.url}" alt="${photo.name}" class="photo-image" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDIwMCAyMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiBmaWxsPSIjRjVGNUY1Ii8+CjxwYXRoIGQ9Ik03NSA3NUgxMjVWMTI1SDc1Vjc1WiIgZmlsbD0iI0RDRENEQyIvPgo8L3N2Zz4K'">
                <div class="photo-info">
                    <div class="photo-name">${photo.name}</div>
                    <div class="photo-meta">
                        ${formatFileSize(photo.size)} • ${formatDate(photo.uploadTime)}
                    </div>
                    <div class="photo-status status-${photo.status}">
                        ${photo.status === 'pending' ? '待审核' : '已审核'}
                    </div>
                    <div class="photo-actions">
                        ${photo.status === 'pending' ? 
                            `<button class="btn btn-approve" onclick="approvePhoto(${index})">通过</button>
                             <button class="btn btn-reject" onclick="rejectPhoto(${index})">删除</button>` :
                            `<button class="btn btn-reject" onclick="rejectPhoto(${index})" style="flex: 1">删除</button>`
                        }
                    </div>
                </div>
            `;
            return card;
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化日期
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('zh-CN') + ' ' + date.toLocaleTimeString('zh-CN', {hour: '2-digit', minute:'2-digit'});
        }

        // 审核通过照片
        async function approvePhoto(index) {
            if (!confirm('确定要通过这张照片吗？')) return;

            allPhotos[index].status = 'approved';
            await updatePhotoRecords();
            showMessage('照片已通过审核');
            updateStats();
            renderPhotoGrid();
        }

        // 拒绝/删除照片
        async function rejectPhoto(index) {
            const photo = allPhotos[index];
            if (!confirm(`确定要删除照片 "${photo.name}" 吗？此操作将永久删除云端文件！`)) return;

            try {
                // 从COS删除文件
                await new Promise((resolve, reject) => {
                    cosClient.deleteObject({
                        Bucket: COS_CONFIG.Bucket,
                        Region: COS_CONFIG.Region,
                        Key: photo.key
                    }, (err, data) => {
                        if (err) reject(err);
                        else resolve(data);
                    });
                });

                // 从记录中删除
                allPhotos.splice(index, 1);
                await updatePhotoRecords();
                showMessage('照片已删除');
                updateStats();
                renderPhotoGrid();

            } catch (error) {
                console.error('删除照片失败:', error);
                showMessage('删除照片失败', 'error');
            }
        }

        // 更新照片记录文件
        async function updatePhotoRecords() {
            try {
                await new Promise((resolve, reject) => {
                    cosClient.putObject({
                        Bucket: COS_CONFIG.Bucket,
                        Region: COS_CONFIG.Region,
                        Key: 'photo_records.json',
                        Body: JSON.stringify(allPhotos, null, 2),
                        ContentType: 'application/json'
                    }, (err, data) => {
                        if (err) reject(err);
                        else resolve(data);
                    });
                });
                console.log('记录文件已更新');
            } catch (error) {
                console.error('更新记录文件失败:', error);
                throw error;
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化COS客户端
            if (initCOSClient()) {
                // 加载照片记录
                loadPhotoRecords();
            }

            // 筛选按钮事件
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentFilter = this.dataset.filter;
                    renderPhotoGrid();
                });
            });
        });
    </script>
</body>
</html>
