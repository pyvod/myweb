    // 文件名常量

        STUDENTS: 'students.json',

    // ============================================
    // COS工具函数

    // 构建COS文件路径
    function getCosFilePath(filename) {
        return `${cosConfig.Folder}${filename}`;
    }

    // 上传数据到COS
    async function uploadToCOS(filename, data) {
        return new Promise((resolve, reject) => {
            cos.putObject({
                Bucket: cosConfig.Bucket,
                Region: cosConfig.Region,
                Key: getCosFilePath(filename),
                StorageClass: 'STANDARD',
                Body: JSON.stringify(data, null, 2),
                ContentType: 'application/json',
                onProgress: function(progressData) {
                    console.log(`上传 ${filename}: ${JSON.stringify(progressData)}`);
                }
            }, function(err, data) {
                if (err) {
                    console.error(`上传 ${filename} 失败:`, err);
                    reject(err);
                } else {
                    console.log(`上传 ${filename} 成功:`, data.Location);
                    resolve(data);
                }
            });
        });
    }

    // 从COS下载数据
    async function downloadFromCOS(filename) {
        return new Promise((resolve, reject) => {
            cos.getObject({
                Bucket: cosConfig.Bucket,
                Region: cosConfig.Region,
                Key: getCosFilePath(filename)
            }, function(err, data) {
                if (err) {
                    // 如果文件不存在，返回null而不是reject
                    if (err.statusCode === 404) {
                        resolve(null);
                    } else {
                        console.error(`下载 ${filename} 失败:`, err);
                        reject(err);
                    }
                } else {
                    try {
                        const content = data.Body ? JSON.parse(data.Body.toString()) : null;
                        console.log(`下载 ${filename} 成功`);
                        resolve(content);
                    } catch (parseError) {
                        console.error(`解析 ${filename} 失败:`, parseError);
                        reject(parseError);
                    }
                }
            });
        });
    }

    // 批量上传所有数据到COS
    async function uploadAllDataToCOS() {
        try {
            console.log('开始上传数据到COS...');
            
            // 创建要上传的数据对象
            const allData = {
                students: students,
                history: history,
                homeworkHistory: homeworkHistory,
                exchangeHistory: exchangeHistory,
                settings: settings,
                gameState: gameState,
                traditionalPrizes: traditionalPrizes,
                morningReadingState: {
                    activeStudents: morningReading.activeStudents,
                    lastUpdate: new Date().toISOString()
                }
            };
            
            // 上传到单个文件（也可以分文件上传，这里使用单个文件简化）
            await uploadToCOS('all_data.json', allData);
            
            // 同时保持分文件上传（可选）
            await Promise.all([
                uploadToCOS(COS_FILES.STUDENTS, students),
                uploadToCOS(COS_FILES.HISTORY, history),
                uploadToCOS(COS_FILES.HOMEWORK, homeworkHistory),
                uploadToCOS(COS_FILES.EXCHANGE, exchangeHistory),
                uploadToCOS(COS_FILES.SETTINGS, settings),
                uploadToCOS(COS_FILES.GAME_STATE, gameState),
                uploadToCOS(COS_FILES.PRIZES, traditionalPrizes),
                uploadToCOS(COS_FILES.MORNING_READING, {
                    activeStudents: morningReading.activeStudents,
                    lastUpdate: new Date().toISOString()
                })
            ]);
            
            console.log('所有数据上传到COS成功');
            showGameMessage('数据已同步到云端');
            return true;
        } catch (error) {
            console.error('上传数据到COS失败:', error);
            showGameMessage('云端同步失败，数据保存到本地');
            return false;
        }
    }

    // 从COS加载所有数据
    async function loadAllDataFromCOS() {
        try {
            console.log('开始从COS加载数据...');
            
            // 尝试从单个文件加载
            const allData = await downloadFromCOS('all_data.json');
            if (allData) {
                return allData;
            }
            
            // 如果单个文件不存在，尝试从分文件加载
            const [
                cosStudents,
                cosHistory,
                cosHomework,
                cosExchange,
                cosSettings,
                cosGameState,
                cosPrizes,
                cosMorningReading
            ] = await Promise.all([
                downloadFromCOS(COS_FILES.STUDENTS),
                downloadFromCOS(COS_FILES.HISTORY),
                downloadFromCOS(COS_FILES.HOMEWORK),
                downloadFromCOS(COS_FILES.EXCHANGE),
                downloadFromCOS(COS_FILES.SETTINGS),
                downloadFromCOS(COS_FILES.GAME_STATE),
                downloadFromCOS(COS_FILES.PRIZES),
                downloadFromCOS(COS_FILES.MORNING_READING)
            ]);
            
            return {
                students: cosStudents,
                history: cosHistory,
                homeworkHistory: cosHomework,
                exchangeHistory: cosExchange,
                settings: cosSettings,
                gameState: cosGameState,
                traditionalPrizes: cosPrizes,
                morningReadingState: cosMorningReading
            };
            
        } catch (error) {
            console.error('从COS加载数据失败:', error);
            return null;
        }
    }

                }, function(err, data) {
                    if (err) {

                    } else {

                    }
                });
            });
            return true;
        } catch (error) {
            console.error('COS连接测试失败:', error);
            return false;
        }

    // 保存数据（同时保存到本地和COS）
    async function saveData() {
        try {
            // 更新设置
            settings.lastUpdate = new Date().toLocaleString('zh-CN');
            
            // 保存到本地存储
            localStorage.setItem('class720_students', JSON.stringify(students));
            localStorage.setItem('class720_history', JSON.stringify(history));
            localStorage.setItem('class720_homework', JSON.stringify(homeworkHistory));
            localStorage.setItem('class720_exchange', JSON.stringify(exchangeHistory));
            localStorage.setItem('class720_settings', JSON.stringify(settings));
            localStorage.setItem('class720_gameState', JSON.stringify(gameState));
            localStorage.setItem('class720_prizes', JSON.stringify(traditionalPrizes));
            localStorage.setItem('class720_morningReading', JSON.stringify({
                activeStudents: morningReading.activeStudents
            }));
            
            // 更新页面
            updateStatistics();
            updateLastSaveTime();
            renderRanking();
            renderDataStats();
            
            // 尝试上传到COS
            await uploadAllDataToCOS();
            
            return true;
        } catch (error) {
            console.error('保存数据失败:', error);
            return false;
        }
    }

    // 从本地和COS加载数据
    async function loadData() {
        try {
            console.log('开始加载数据...');
            
            // 首先尝试从COS加载
            const cosData = await loadAllDataFromCOS();
            
            if (cosData) {
                console.log('从COS加载数据成功');
                
                // 使用COS数据
                students = cosData.students || JSON.parse(JSON.stringify(initialStudents));
                history = cosData.history || [];
                homeworkHistory = cosData.homeworkHistory || [];
                exchangeHistory = cosData.exchangeHistory || [];
                settings = cosData.settings || getDefaultSettings();
                gameState = cosData.gameState || getDefaultGameState();
                traditionalPrizes = cosData.traditionalPrizes || traditionalPrizes;
                
                if (cosData.morningReadingState) {
                    morningReading.activeStudents = cosData.morningReadingState.activeStudents || [];
                }
                
            } else {
                console.log('COS无数据，从本地存储加载');
                
                // 从本地存储加载
                students = JSON.parse(localStorage.getItem('class720_students')) || JSON.parse(JSON.stringify(initialStudents));
                history = JSON.parse(localStorage.getItem('class720_history')) || [];
                homeworkHistory = JSON.parse(localStorage.getItem('class720_homework')) || [];
                exchangeHistory = JSON.parse(localStorage.getItem('class720_exchange')) || [];
                settings = JSON.parse(localStorage.getItem('class720_settings')) || getDefaultSettings();
                gameState = JSON.parse(localStorage.getItem('class720_gameState')) || getDefaultGameState();
                traditionalPrizes = JSON.parse(localStorage.getItem('class720_prizes')) || traditionalPrizes;
                
                const morningReadingData = JSON.parse(localStorage.getItem('class720_morningReading'));
                if (morningReadingData) {
                    morningReading.activeStudents = morningReadingData.activeStudents || [];
                }
            }
            
            // 检查数据完整性
            validateData();
            
            console.log('数据加载完成');
            return true;
            
        } catch (error) {
            console.error('加载数据失败:', error);
            
            // 加载失败时使用默认数据
            students = JSON.parse(JSON.stringify(initialStudents));
            history = [];
            homeworkHistory = [];
            exchangeHistory = [];
            settings = getDefaultSettings();
            gameState = getDefaultGameState();
            traditionalPrizes = traditionalPrizes;
            morningReading.activeStudents = [];
            
            return false;
        }
    }

    function getDefaultGameState() {
        return {

            subjects: {
                "语文": { completedStudents: [], subjectBonus: 0, isActive: false },
                "数学": { completedStudents: [], subjectBonus: 0, isActive: false },

            }

    // 数据验证
    function validateData() {
        // 确保所有学生都有必需的字段
        students.forEach(student => {
            if (!student.hasOwnProperty('weekDeductions')) student.weekDeductions = 0;
            if (!student.hasOwnProperty('homeworkBonus')) student.homeworkBonus = 0;
            if (!student.hasOwnProperty('score')) student.score = 0;
        });
        
        // 确保设置完整
        if (!settings.version) settings.version = "8.0";
        if (!settings.todayDate) settings.todayDate = new Date().toDateString();
        if (!settings.weekStartDate) settings.weekStartDate = getWeekStartDate();
    }

    // 渲染奖品网格（修改版）
    function renderPrizeGrid(category = "all") {
        const prizeGrid = document.getElementById('snackGrid');
        if (!prizeGrid) return;
        
        prizeGrid.innerHTML = '';
        
        const filteredPrizes = category === "all" 
            ? traditionalPrizes 
            : traditionalPrizes.filter(prize => prize.category === category);
        
        if (filteredPrizes.length === 0) {
            prizeGrid.innerHTML = `
                <div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: #6c757d;">
                    <i class="fas fa-box-open fa-3x" style="margin-bottom: 15px;"></i>
                    <h4>暂无此类奖品</h4>
                    <p>请选择其他分类或添加新奖品</p>
                </div>
            `;
            return;
        }
        
        filteredPrizes.forEach(prize => {
            const prizeCard = document.createElement('div');
            prizeCard.className = `snack-card ${prize.category} ${selectedPrize && selectedPrize.id === prize.id ? 'selected' : ''}`;
            prizeCard.dataset.id = prize.id;
            
            const isOutOfStock = prize.stock <= 0;
            if (isOutOfStock) {
                prizeCard.classList.add('out-of-stock');
                prizeCard.style.opacity = '0.6';
            }
            
            prizeCard.innerHTML = `
                <div class="snack-icon">
                    <i class="${prize.icon}"></i>
                </div>
                <div class="snack-name">${prize.name}</div>
                <div class="snack-description">${prize.description}</div>
                <div class="snack-cost">
                    <i class="fas fa-coins"></i> ${prize.cost} 积分
                </div>
                <div class="category-badge">${getCategoryName(prize.category)}</div>
                <div class="stock-badge" style="position: absolute; top: 8px; left: 8px; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; background-color: #e3f2fd; color: #1565c0;">
                    库存: ${prize.stock}
                </div>
                ${isOutOfStock ? '<div class="out-of-stock-badge" style="position: absolute; bottom: 8px; left: 8px; font-size: 0.7rem; padding: 2px 6px; border-radius: 10px; background-color: #ffcdd2; color: #c62828;">已售罄</div>' : ''}
            `;
            
            if (!isOutOfStock) {
                prizeCard.addEventListener('click', function() {
                    selectPrize(prize);
                });
            }
            
            prizeGrid.appendChild(prizeCard);
        });
    }

    // 选择奖品
    function selectPrize(prize) {
        selectedPrize = prize;
        
        // 更新UI
        document.querySelectorAll('.snack-card').forEach(card => {
            card.classList.remove('selected');
            if (parseInt(card.dataset.id) === prize.id) {
                card.classList.add('selected');
            }
        });
        
        // 更新选中的奖品显示
        const selectedPrizeContainer = document.getElementById('selectedSnackContainer');
        if (selectedPrizeContainer) {
            selectedPrizeContainer.innerHTML = `
                <div class="snack-selected">
                    <div class="snack-selected-icon">
                        <i class="${prize.icon}"></i>
                    </div>
                    <div class="snack-selected-info">
                        <div class="snack-selected-name">${prize.name}</div>
                        <div class="snack-selected-description">${prize.description}</div>
                        <div class="snack-selected-cost">
                            <i class="fas fa-coins"></i> ${prize.cost} 积分
                        </div>
                        <div class="snack-stock">库存：${prize.stock} 份</div>
                        <div style="margin-top: 10px; font-size: 0.9rem; color: #666;">
                            <i class="fas fa-tag"></i> ${getCategoryName(prize.category)}
                        </div>
                    </div>
                </div>
            `;
        }
        
        // 更新兑换摘要
        updateExchangeSummary();
    }

    // 添加新奖品
    function addNewPrize() {
        const name = document.getElementById('newPrizeName').value.trim();
        const cost = parseInt(document.getElementById('newPrizeCost').value);
        const category = document.getElementById('newPrizeCategory').value;
        const stock = parseInt(document.getElementById('newPrizeStock').value);
        const description = document.getElementById('newPrizeDescription').value.trim();
        const icon = document.getElementById('newPrizeIcon').value.trim();
        
        if (!name) {
            alert('请输入奖品名称！');
            return;
        }
        
        if (isNaN(cost) || cost <= 0) {
            alert('请输入有效的积分值！');
            return;
        }
        
        if (isNaN(stock) || stock < 0) {
            alert('请输入有效的库存数量！');
            return;
        }
        
        if (!description) {
            alert('请输入奖品描述！');
            return;
        }
        
        if (!icon) {
            alert('请输入奖品图标！');
            return;
        }
        
        // 检查是否已存在相同名称的奖品
        const existingPrize = traditionalPrizes.find(p => p.name === name);
        if (existingPrize) {
            if (!confirm(`已存在名为"${name}"的奖品，是否更新它？`)) {
                return;
            }
            
            // 更新现有奖品
            existingPrize.cost = cost;
            existingPrize.category = category;
            existingPrize.stock = stock;
            existingPrize.description = description;
            existingPrize.icon = icon;
        } else {
            // 添加新奖品
            const newId = traditionalPrizes.length > 0 
                ? Math.max(...traditionalPrizes.map(p => p.id)) + 1 
                : 1;
            
            traditionalPrizes.push({
                id: newId,
                name: name,
                description: description,
                cost: cost,
                icon: icon,
                category: category,
                stock: stock
            });
        }
        
        // 保存数据
        saveData();
        
        // 更新UI
        renderPrizeGrid(getCurrentCategory());
        renderPrizeList();
        
        // 清空表单
        document.getElementById('newPrizeName').value = '';
        document.getElementById('newPrizeCost').value = '10';
        document.getElementById('newPrizeStock').value = '20';
        document.getElementById('newPrizeDescription').value = '';
        document.getElementById('newPrizeIcon').value = 'fas fa-gift';
        
        showGameMessage(`奖品"${name}"已${existingPrize ? '更新' : '添加'}`);
    }

    // 删除奖品
    function deletePrize(prizeId) {
        if (!confirm('确定要删除这个奖品吗？此操作不可撤销！')) {
            return;
        }
        
        const prizeIndex = traditionalPrizes.findIndex(p => p.id === prizeId);
        if (prizeIndex !== -1) {
            const prizeName = traditionalPrizes[prizeIndex].name;
            traditionalPrizes.splice(prizeIndex, 1);
            
            // 如果删除的是当前选中的奖品，清空选择
            if (selectedPrize && selectedPrize.id === prizeId) {
                clearExchangeSelection();
            }
            
            // 保存数据
            saveData();
            
            // 更新UI
            renderPrizeGrid(getCurrentCategory());
            renderPrizeList();
            
            showGameMessage(`奖品"${prizeName}"已删除`);
        }
    }

    // 编辑奖品
    function editPrize(prizeId) {
        const prize = traditionalPrizes.find(p => p.id === prizeId);
        if (!prize) return;
        
        // 填充表单
        document.getElementById('newPrizeName').value = prize.name;
        document.getElementById('newPrizeCost').value = prize.cost;
        document.getElementById('newPrizeCategory').value = prize.category;
        document.getElementById('newPrizeStock').value = prize.stock;
        document.getElementById('newPrizeDescription').value = prize.description;
        document.getElementById('newPrizeIcon').value = prize.icon;
        
        // 滚动到表单顶部
        document.getElementById('newPrizeName').scrollIntoView({ behavior: 'smooth' });
        
        showGameMessage(`正在编辑奖品"${prize.name}"`);
    }

    // 渲染奖品列表（管理界面）
    function renderPrizeList() {
        const container = document.getElementById('prizeListContainer');
        if (!container) return;
        
        container.innerHTML = '';
        
        if (traditionalPrizes.length === 0) {
            container.innerHTML = `
                <div style="text-align: center; padding: 30px; color: #6c757d;">
                    <i class="fas fa-gifts fa-3x" style="margin-bottom: 15px;"></i>
                    <h4>暂无奖品</h4>
                    <p>请添加第一个奖品</p>
                </div>
            `;
            return;
        }
        
        const table = document.createElement('table');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        
        table.innerHTML = `
            <thead>
                <tr style="background-color: #f5f5f5;">
                    <th style="padding: 10px; text-align: left;">奖品</th>
                    <th style="padding: 10px; text-align: left;">积分</th>
                    <th style="padding: 10px; text-align: left;">库存</th>
                    <th style="padding: 10px; text-align: left;">分类</th>
                    <th style="padding: 10px; text-align: left;">操作</th>
                </tr>
            </thead>
            <tbody>
                ${traditionalPrizes.map(prize => `
                    <tr style="border-bottom: 1px solid #eee;">
                        <td style="padding: 10px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <i class="${prize.icon}" style="color: #ff9800;"></i>
                                <div>
                                    <div style="font-weight: bold;">${prize.name}</div>
                                    <div style="font-size: 0.8rem; color: #666;">${prize.description}</div>
                                </div>
                            </div>
                        </td>
                        <td style="padding: 10px; font-weight: bold; color: #ff9800;">${prize.cost}</td>
                        <td style="padding: 10px;">
                            <span style="padding: 3px 8px; background-color: ${prize.stock > 10 ? '#e8f5e9' : (prize.stock > 0 ? '#fff3e0' : '#ffebee')}; border-radius: 4px; color: ${prize.stock > 10 ? '#2e7d32' : (prize.stock > 0 ? '#f57c00' : '#c62828')};">
                                ${prize.stock}
                            </span>
                        </td>
                        <td style="padding: 10px;">
                            <span class="category-badge">${getCategoryName(prize.category)}</span>
                        </td>
                        <td style="padding: 10px;">
                            <div style="display: flex; gap: 5px;">
                                <button class="btn-edit" data-id="${prize.id}" style="padding: 5px 10px; background-color: #2196f3; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-delete" data-id="${prize.id}" style="padding: 5px 10px; background-color: #f44336; color: white; border: none; border-radius: 4px; cursor: pointer;">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                `).join('')}
            </tbody>
        `;
        
        container.appendChild(table);
        
        // 添加事件监听器
        table.querySelectorAll('.btn-edit').forEach(btn => {
            btn.addEventListener('click', function() {
                const prizeId = parseInt(this.dataset.id);
                editPrize(prizeId);
            });
        });
        
        table.querySelectorAll('.btn-delete').forEach(btn => {
            btn.addEventListener('click', function() {
                const prizeId = parseInt(this.dataset.id);
                deletePrize(prizeId);
            });
        });
    }

    // 打开奖品管理模态框
    function openPrizeManagement() {
        const modal = document.getElementById('prizeManagementModal');
        if (modal) {
            modal.style.display = 'block';
            renderPrizeList();
        }
    }

    // 关闭奖品管理模态框
    function closePrizeManagement() {
        const modal = document.getElementById('prizeManagementModal');
        if (modal) {
            modal.style.display = 'none';
        }
    }

    // ============================================
    // 积分兑换功能（修改版）
    // ============================================

    // 执行兑换（修改版，使用prize而不是snack）
    function performExchange() {
        if (!selectedPrize || !selectedStudentId) {
            alert('请选择奖品和学生！');
            return;
        }
        
        const student = students.find(s => s.id === selectedStudentId);
        const prize = selectedPrize;
        
        if (!student || !prize) {
            alert('数据错误，请刷新页面重试！');
            return;
        }
        
        // 检查积分是否足够
        if (student.score < prize.cost) {
            alert(`积分不足！${student.name} 当前只有 ${student.score} 积分，需要 ${prize.cost} 积分。`);
            return;
        }
        
        // 检查库存
        if (prize.stock <= 0) {
            alert(`抱歉，${prize.name} 已售罄！`);
            return;
        }
        
        if (confirm(`确定要为 ${student.name} 兑换 ${prize.name} 吗？将扣除 ${prize.cost} 积分。`)) {
            // 扣除积分
            student.score -= prize.cost;
            
            // 减少库存
            prize.stock--;
            
            // 添加兑换记录
            const exchangeRecord = {
                id: exchangeHistory.length + 1,
                studentId: student.id,
                studentName: student.name,
                prizeId: prize.id,
                prizeName: prize.name,
                prizeCost: prize.cost,
                timestamp: new Date().toISOString()
            };
            
            exchangeHistory.unshift(exchangeRecord);
            
            // 添加积分变动记录
            addHistoryRecord(student.id, -prize.cost, `兑换${prize.name}`);
            
            // 保存数据
            saveData();
            
            // 更新页面
            updateExchangeBalance();
            updateExchangeSummary();
            renderStudentTable();
            renderRanking();
            populateExchangeStudentSelect();
            renderPrizeGrid(getCurrentCategory());
            renderExchangeHistory();
            
            // 显示成功消息
            showGameMessage(`✓ ${student.name} 成功兑换 ${prize.name}，扣除 ${prize.cost} 积分`);
            
            // 清空选择
            clearExchangeSelection();
        }
    }

    // ============================================
    // 其他核心函数（需要小修改）
    // ============================================

    // 获取分类名称（保持不变）
    function getCategoryName(category) {
        const categoryNames = {
            "candy": "糖果糕点",
            "pastry": "传统糕点",
            "nut": "坚果炒货",
            "drink": "传统饮品",
            "other": "其他"
        };
        return categoryNames[category] || category;
    }

    // 更新兑换摘要（修改版）
    function updateExchangeSummary() {
        if (!selectedPrize) return;
        
        const summaryName = document.getElementById('summaryName');
        const summaryCost = document.getElementById('summaryCost');
        if (summaryName && summaryCost) {
            summaryName.textContent = selectedPrize.name;
            summaryCost.textContent = selectedPrize.cost;
        }
        
        if (selectedStudentId) {
            const student = students.find(s => s.id === selectedStudentId);
            if (student) {
                const summaryBalance = document.getElementById('summaryBalance');
                const summaryRemaining = document.getElementById('summaryRemaining');
                const confirmBtn = document.getElementById('confirmExchangeBtn');
                
                if (summaryBalance) summaryBalance.textContent = student.score;
                
                const remaining = student.score - selectedPrize.cost;
                if (summaryRemaining) {
                    summaryRemaining.textContent = remaining;
                    
                    if (remaining < 0) {
                        summaryRemaining.classList.remove('success');
                        summaryRemaining.classList.add('error');
                        if (confirmBtn) confirmBtn.disabled = true;
                    } else {
                        summaryRemaining.classList.remove('error');
                        summaryRemaining.classList.add('success');
                        if (confirmBtn) confirmBtn.disabled = false;
                    }
                }
            }
        }
    }

    // 初始化兑换功能（修改版）
    function initExchange() {
        renderPrizeGrid();
        renderExchangeHistory();
        setupExchangeEventListeners();
        updateExchangeBalance();
        
        // 添加奖品管理按钮
        const exchangeHeader = document.querySelector('.exchange-header');
        if (exchangeHeader) {
            const manageBtn = document.createElement('button');
            manageBtn.className = 'btn btn-primary';
            manageBtn.innerHTML = '<i class="fas fa-cog"></i> 管理奖品';
            manageBtn.style.marginLeft = '10px';
            manageBtn.onclick = openPrizeManagement;
            
            exchangeHeader.querySelector('.card-title').appendChild(manageBtn);
        }
    }

    // ============================================
    // 事件监听器设置（新增奖品管理相关）
    // ============================================

    // 设置兑换事件监听器（修改版）
    function setupExchangeEventListeners() {
        // 分类标签切换
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderPrizeGrid(this.dataset.category);
            });
        });
        
        // 确认兑换按钮
        const confirmExchangeBtn = document.getElementById('confirmExchangeBtn');
        if (confirmExchangeBtn) {
            confirmExchangeBtn.addEventListener('click', performExchange);
        }
        
        // 取消选择按钮
        const clearExchangeBtn = document.getElementById('clearExchangeBtn');
        if (clearExchangeBtn) {
            clearExchangeBtn.addEventListener('click', clearExchangeSelection);
        }
        
        // 兑换学生选择下拉框
        const exchangeStudentSelect = document.getElementById('exchangeStudentSelect');
        if (exchangeStudentSelect) {
            exchangeStudentSelect.addEventListener('change', function() {
                selectedStudentId = this.value ? parseInt(this.value) : null;
                updateExchangeSummary();
            });
        }
        
        // 奖品管理相关
        const addPrizeBtn = document.getElementById('addPrizeBtn');
        if (addPrizeBtn) {
            addPrizeBtn.addEventListener('click', addNewPrize);
        }
        
        const closePrizeModalBtn = document.getElementById('closePrizeModal');
        if (closePrizeModalBtn) {
            closePrizeModalBtn.addEventListener('click', closePrizeManagement);
        }
        
        // 点击模态框外部关闭
        const modal = document.getElementById('prizeManagementModal');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closePrizeManagement();
                }
            });
        }
    }

    // ============================================
    // 初始化函数（修改版）
    // ============================================

    // 主初始化函数
    async function initialize() {
        try {
            console.log('系统初始化开始...');
            
            // 测试COS连接
            const cosConnected = await testCOSConnection();
            if (cosConnected) {
                console.log('COS连接成功');
                settings.cosEnabled = true;
                settings.lastCosSync = new Date().toISOString();
            } else {
                console.log('COS连接失败，使用本地存储');
                settings.cosEnabled = false;
            }
            
            // 加载数据
            await loadData();
            
            // 检查日期重置
            checkDateReset();
            
            // 初始化UI
            updateLastSaveTime();
            updateStatistics();
            updateGameStats();
            updateSubjectProgress();
            renderStudentTable();
            populateStudentSelect();
            populateExchangeStudentSelect();
            renderHistory();
            renderRanking();
            renderDataStats();
            
            // 初始化各功能模块
            renderStudentGrid();
            renderSubjectProgressSummary();
            setupGameEventListeners();
            initMorningReading();
            initExchange();
            
            // 设置事件监听器
            setupEventListeners();
            
            // 更新早读活跃人数显示
            const morningReadingActiveElement = document.getElementById('morningReadingActive');
            if (morningReadingActiveElement) {
                morningReadingActiveElement.textContent = morningReading.activeStudents.length;
            }
            
            console.log('系统初始化完成');
            showGameMessage('系统已就绪' + (settings.cosEnabled ? '（云端同步已启用）' : '（使用本地存储）'));
            
        } catch (error) {
            console.error('初始化失败:', error);
            alert('系统初始化失败，请刷新页面重试');
        }
    }

    // ============================================
    // 页面加载
    // ============================================

    // 当DOM内容加载完成后初始化页面
    document.addEventListener('DOMContentLoaded', initialize);
    </script>
