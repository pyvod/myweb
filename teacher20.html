<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瓶窑第一中学班级作业管理系统 - 教师端</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #e74c3c);
            color: white;
            padding: 25px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        .header .subtitle {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 12px 25px;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sync-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sync-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #28a745;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #212529;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-info {
            background: #17a2b8;
            color: white;
        }

        .btn-announcement {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .content {
            padding: 25px;
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
            min-height: 600px;
        }

        .editor-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .preview-section {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            max-height: 800px;
            overflow-y: auto;
        }

        .section-title {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 8px;
        }

        /* 新增登录样式 */
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 20px 0;
        }

        .login-input {
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 1em;
            transition: border-color 0.3s ease;
        }

        .login-input:focus {
            outline: none;
            border-color: #007bff;
        }

        .login-btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            background: #0056b3;
        }

        /* 统一班级选择样式 - 与喊话系统一致 */
        .grade-class-container {
            margin: 15px 0;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 15px;
            background: #f8f9fa;
        }

        .grade-selector {
            margin-bottom: 15px;
        }

        .class-selection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: nowrap;
        }

        .header-box {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .select-all-box {
            justify-content: flex-start;
            min-width: 140px;
            flex-shrink: 0;
        }

        .online-stats-box {
            justify-content: flex-end;
            text-align: right;
            min-width: 140px;
            flex-shrink: 0;
        }

        .header-box label {
            margin: 0;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            cursor: pointer;
            font-size: 14px;
        }

        .header-box .online-stats {
            margin: 0;
            font-weight: bold;
            color: #2c3e50;
            white-space: nowrap;
            font-size: 14px;
        }

        .header-box input[type="checkbox"] {
            margin: 0;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .class-grid-container {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e1e8ed;
            border-radius: 8px;
            background: white;
            padding: 10px;
        }

        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }

        .class-item-compact {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #e1e8ed;
            border-radius: 6px;
            background: white;
            transition: all 0.2s ease;
            cursor: pointer;
            min-height: 44px;
        }

        .class-item-compact:hover {
            border-color: #3498db;
            background: #f8fafc;
        }

        .class-item-compact.selected {
            border-color: #3498db;
            background: #e3f2fd;
        }

        .class-item-compact input {
            margin-right: 10px;
            flex-shrink: 0;
            width: 16px;
            height: 16px;
        }

        .class-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
            overflow: hidden;
        }

        .class-name-main {
            font-size: 14px;
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.2;
            display: block;
            width: 100%;
        }

        .class-status-row {
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 16px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .status-dot.online {
            background: #28a745;
        }

        .status-dot.offline {
            background: #dc3545;
        }

        .status-text {
            font-size: 11px;
            color: #6c757d;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 紧凑布局调整 */
        .compact-layout {
            max-height: 200px;
        }

        .compact-grid {
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr;
            }
            
            .preview-section {
                max-height: none;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }
            
            .status-bar {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }
            
            .subject-buttons {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .controls {
                justify-content: center;
            }
            
            .action-buttons {
                justify-content: center;
            }
            
            .selector-row {
                flex-direction: column;
            }
            
            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 登录页面 -->
    <div id="loginPage" class="login-container" style="display: none;">
        <h1>瓶窑第一中学作业管理系统</h1>
        <p class="subtitle">教师端 - 请登录</p>
        
        <form class="login-form" id="loginForm">
            <input type="text" class="login-input" id="username" placeholder="用户名" required>
            <input type="password" class="login-input" id="password" placeholder="密码" required>
            <button type="submit" class="login-btn">登录</button>
        </form>
        
        <div id="loginStatus" style="color: #dc3545; margin-top: 10px;"></div>
    </div>

    <!-- 主应用页面 -->
    <div id="appPage" class="container" style="display: none;">
        <div class="header">
            <h1>瓶窑第一中学作业管理系统</h1>
            <div class="subtitle">教师端 - <span id="userInfo">欢迎</span></div>
        </div>

        <div class="status-bar">
            <div class="sync-status">
                <div class="sync-indicator"></div>
                <span id="syncStatus">正在连接云端...</span>
            </div>
            <div class="controls">
                <button class="btn btn-primary" onclick="loadHomeworkData()">
                    📥 加载作业
                </button>
                <button class="btn btn-success" onclick="saveAll()">
                    💾 保存全部
                </button>
                <button class="btn btn-info" onclick="showConfigModal()">
                    ⚙️ 系统设置
                </button>
                <a class="btn btn-announcement" href="http://10.59.14.251:5000" target="_blank">
                    📢 教师喊话
                </a>
                <button class="btn btn-warning" onclick="logout()">
                    🚪 退出登录
                </button>
            </div>
        </div>

        <div class="content">
            <div class="editor-section">
                <h2 class="section-title">作业编辑</h2>
                
                <!-- 统一班级选择区域 - 与喊话系统一致 -->
                <div class="grade-class-container">
                    <div class="grade-selector">
                        <label for="gradeSelect">选择年级:</label>
                        <select id="gradeSelect" class="selector-input" onchange="updateClassGrid()">
                            <option value="all">全部年级</option>
                            <option value="初一">初一年级</option>
                            <option value="初二">初二年级</option>
                            <option value="初三">初三年级</option>
                        </select>
                    </div>
                    
                    <div class="class-selection-header">
                        <div class="header-box select-all-box">
                            <input type="checkbox" id="selectAll" onchange="toggleAllClasses()">
                            <label for="selectAll">所有班级</label>
                        </div>
                        <div class="header-box online-stats-box">
                            <div class="online-stats" id="onlineStats">
                                已选择: 0 个班级
                            </div>
                        </div>
                    </div>
                    
                    <div class="class-grid-container compact-layout">
                        <div class="class-grid compact-grid" id="classGrid">
                            <div class="empty-state">正在加载班级列表...</div>
                        </div>
                    </div>
                </div>

                <!-- 科目选择区域 -->
                <div class="subject-selector">
                    <h3>选择科目：</h3>
                    <div class="subject-buttons" id="subjectButtons">
                        <!-- 科目按钮将通过JavaScript动态生成 -->
                    </div>
                </div>

                <!-- 作业编辑区域 -->
                <div class="editor-container">
                    <label class="editor-label" id="editorLabel">语文作业内容：</label>
                    <textarea 
                        class="homework-editor" 
                        id="homeworkEditor"
                        placeholder="请输入作业内容...（支持多行输入）"
                    ></textarea>
                </div>

                <!-- 操作按钮区域 -->
                <div class="action-buttons">
                    <button class="btn btn-success" onclick="saveCurrent()">
                        💾 保存当前科目
                    </button>
                    <button class="btn btn-warning" onclick="copyToAllClasses()">
                        📋 复制到同年级所有班级
                    </button>
                    <button class="btn btn-danger" onclick="clearCurrent()">
                        🗑️ 清空当前科目
                    </button>
                </div>
            </div>

            <div class="preview-section">
                <h2 class="section-title">实时预览</h2>
                <div id="previewContainer">
                    <!-- 预览内容将通过JavaScript动态生成 -->
                </div>
                <div class="last-updated" id="lastUpdated">
                    <!-- 最后更新时间 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 通知消息 -->
    <div class="notification" id="notification"></div>

    <!-- 配置模态框 -->
    <div class="modal" id="configModal">
        <div class="modal-content">
            <h3 class="modal-title">系统设置</h3>
            
            <div class="modal-tabs">
                <button class="modal-tab active" data-tab="storage">云存储设置</button>
                <button class="modal-tab" data-tab="links">班级链接生成</button>
            </div>
            
            <!-- 云存储设置标签页 -->
            <div class="modal-tab-content active" id="storageTab">
                <div class="config-form">
                    <div class="form-group">
                        <label class="form-label">腾讯云 SecretId</label>
                        <input type="text" class="form-input" id="secretId" 
                               placeholder="请输入SecretId">
                    </div>
                    <div class="form-group">
                        <label class="form-label">腾讯云 SecretKey</label>
                        <input type="password" class="form-input" id="secretKey" 
                               placeholder="请输入SecretKey">
                    </div>
                    <div class="form-group">
                        <label class="form-label">存储桶名称</label>
                        <input type="text" class="form-input" id="cosBucket" 
                               value="class-homework-1257663765" readonly>
                    </div>
                    <div class="form-group">
                        <label class="form-label">地域</label>
                        <input type="text" class="form-input" id="cosRegion" 
                               value="ap-beijing" readonly>
                    </div>
                    <div class="form-actions">
                        <button class="btn btn-warning" onclick="testConnection()">
                            🔍 测试连接
                        </button>
                        <button class="btn btn-success" onclick="saveConfig()">
                            💾 保存配置
                        </button>
                        <button class="btn btn-danger" onclick="hideConfigModal()">
                            ❌ 取消
                        </button>
                    </div>
                </div>
            </div>
            
            <!-- 班级链接生成标签页 -->
            <div class="modal-tab-content" id="linksTab">
                <div class="config-form">
                    <div class="form-group">
                        <label class="form-label">选择年级和班级生成家长端链接：</label>
                        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                            <select class="form-input" id="linkGrade" style="flex: 1;">
                                <option value="初一">初一年级</option>
                                <option value="初二">初二年级</option>
                                <option value="初三">初三年级</option>
                            </select>
                            <select class="form-input" id="linkClass" style="flex: 1;">
                                <!-- 班级选项动态生成 -->
                            </select>
                        </div>
                    </div>
                    <div class="link-controls">
                        <button class="btn btn-success" onclick="generateClassLink()">
                            🔗 生成班级链接
                        </button>
                        <button class="btn btn-info" onclick="generateAllClassLinks()">
                            📋 生成所有班级链接
                        </button>
                    </div>
                    <div class="generated-link" id="generatedLink">
                        <div class="link-text" id="classLinkText"></div>
                        <div style="display: flex; gap: 8px;">
                            <button class="btn btn-success" onclick="copyClassLink()">
                                📋 复制链接
                            </button>
                            <button class="btn btn-primary" onclick="testClassLink()">
                                🔍 测试链接
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let homeworkData = null;
        let currentSubject = '语文';
        let currentGrade = '初一';
        let currentClass = '1班';
        
        // 用户信息
        let currentUser = null;
        let userClasses = [];
        
        // 存储桶配置
        const COS_CONFIG = {
            bucket: 'class-homework-1257663765',
            region: 'ap-beijing'
        };
        
        let config = {
            secretId: 'AKIDXsyve7LJ4bu0wc4GExue8PRDvOcaIm36',
            secretKey: 'tXw61g5FBsKZYIm10jDTYO4UfaGgqlQp',
            ...COS_CONFIG
        };

        // 年级班级配置
        const gradeConfig = {
            '初一': 26,
            '初二': 23,
            '初三': 23
        };

        // 科目列表
        const subjects = [
            { id: '语文', name: '语文' },
            { id: '数学', name: '数学' },
            { id: '英语', name: '英语' },
            { id: '科学', name: '科学' },
            { id: '道法', name: '道法' },
            { id: '社会', name: '社会' },
            { id: '晨读', name: '晨读' }
        ];

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
        });

        // 检查登录状态
        function checkLoginStatus() {
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = JSON.parse(savedUser);
                userClasses = currentUser.classes || [];
                showAppPage();
            } else {
                showLoginPage();
            }
        }

        // 显示登录页面
        function showLoginPage() {
            document.getElementById('loginPage').style.display = 'block';
            document.getElementById('appPage').style.display = 'none';
            
            // 添加登录表单提交事件
            document.getElementById('loginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                login();
            });
        }

        // 显示应用页面
        function showAppPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'block';
            
            // 更新用户信息显示
            document.getElementById('userInfo').textContent = 
                `欢迎, ${currentUser.real_name || currentUser.username} (${getRoleDisplayName(currentUser.role)})`;
            
            initializeApp();
        }

        // 用户登录
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('loginStatus');
            
            if (!username || !password) {
                statusDiv.textContent = '请输入用户名和密码';
                return;
            }
            
            try {
                // 从喊话系统加载用户数据
                const response = await fetch('http://10.59.14.251:5000/get_all_users');
                const data = await response.json();
                
                if (data.status === 'success') {
                    // 在所有用户中查找
                    const allUsers = [...data.users, ...data.pending_users];
                    const user = allUsers.find(u => u.username === username);
                    
                    if (!user) {
                        statusDiv.textContent = '用户不存在';
                        return;
                    }
                    
                    // 检查用户状态
                    if (user.status !== 'approved' && user.role !== 'super_admin') {
                        statusDiv.textContent = '用户注册申请正在审核中，请等待管理员审核';
                        return;
                    }
                    
                    // 验证密码（这里简化处理，实际应该使用哈希验证）
                    // 注意：在实际应用中，密码验证应该在服务器端进行
                    if (user.password !== hashPassword(password)) {
                        statusDiv.textContent = '密码错误';
                        return;
                    }
                    
                    // 登录成功
                    currentUser = {
                        username: user.username,
                        real_name: user.real_name,
                        role: user.role,
                        classes: user.classes || []
                    };
                    
                    userClasses = currentUser.classes;
                    
                    // 保存用户信息到本地存储
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    
                    showAppPage();
                    
                } else {
                    statusDiv.textContent = '加载用户数据失败: ' + data.message;
                }
                
            } catch (error) {
                statusDiv.textContent = '登录失败: ' + error.message;
                console.error('登录错误:', error);
            }
        }

        // 密码哈希函数（与喊话系统一致）
        function hashPassword(password) {
            // 这里应该使用与喊话系统相同的哈希算法
            // 简化版本，实际应该使用SHA256
            return btoa(unescape(encodeURIComponent(password))); // Base64编码作为示例
        }

        // 获取角色显示名称
        function getRoleDisplayName(role) {
            const roleNames = {
                'normal': '普通老师',
                'teacher': '子管理员',
                'admin': '管理员',
                'super_admin': '超级管理员'
            };
            return roleNames[role] || role;
        }

        // 退出登录
        function logout() {
            if (confirm('确定要退出登录吗？')) {
                localStorage.removeItem('currentUser');
                currentUser = null;
                userClasses = [];
                showLoginPage();
            }
        }

        // 初始化应用
        function initializeApp() {
            loadConfig();
            initializeGradeSelect();
            initializeClassGrid();
            initializeSubjectButtons();
            initializeLinkGenerator();
            initializeModalTabs();
            loadHomeworkData();
        }

        // 初始化班级网格
        function initializeClassGrid() {
            updateClassGrid();
        }

        // 更新班级网格显示
        function updateClassGrid() {
            const gradeSelect = document.getElementById('gradeSelect');
            const classGrid = document.getElementById('classGrid');
            
            if (!gradeSelect || !classGrid) return;
            
            const selectedGrade = gradeSelect.value;
            
            // 生成所有班级
            let allClasses = [];
            if (selectedGrade === 'all') {
                // 显示所有年级的班级
                Object.keys(gradeConfig).forEach(grade => {
                    const classCount = gradeConfig[grade];
                    for (let i = 1; i <= classCount; i++) {
                        allClasses.push(`${grade}${i}班`);
                    }
                });
            } else {
                // 显示指定年级的班级
                const classCount = gradeConfig[selectedGrade];
                for (let i = 1; i <= classCount; i++) {
                    allClasses.push(`${selectedGrade}${i}班`);
                }
            }
            
            // 根据用户权限过滤班级
            let filteredClasses = allClasses;
            if (currentUser.role !== 'super_admin' && !userClasses.includes('all')) {
                filteredClasses = allClasses.filter(className => userClasses.includes(className));
            }
            
            // 清空网格
            classGrid.innerHTML = '';
            
            if (filteredClasses.length === 0) {
                classGrid.innerHTML = '<div class="empty-state">该年级暂无班级或您没有权限</div>';
                return;
            }
            
            // 生成班级复选框
            filteredClasses.forEach(className => {
                const classItem = document.createElement('div');
                classItem.className = 'class-item-compact';
                
                classItem.innerHTML = `
                    <input type="checkbox" value="${className}" 
                           onchange="updateClassSelection()">
                    <div class="class-info">
                        <div class="class-name-main" title="${className}">
                            ${className}
                        </div>
                        <div class="class-status-row">
                            <div class="status-dot online"></div>
                            <div class="status-text">可编辑</div>
                        </div>
                    </div>
                `;
                
                // 点击整个项也可以选择
                classItem.addEventListener('click', function(e) {
                    if (e.target.type !== 'checkbox') {
                        const checkbox = this.querySelector('input[type="checkbox"]');
                        checkbox.checked = !checkbox.checked;
                        updateClassSelection();
                    }
                });
                
                classGrid.appendChild(classItem);
            });
            
            updateClassSelection();
        }

        // 切换所有班级选择
        function toggleAllClasses() {
            const selectAll = document.getElementById('selectAll');
            const classGrid = document.getElementById('classGrid');
            if (!selectAll || !classGrid) return;
            
            const checkboxes = classGrid.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = selectAll.checked;
            });
            
            updateClassSelection();
        }

        // 更新班级选择状态
        function updateClassSelection() {
            const classGrid = document.getElementById('classGrid');
            const selectAll = document.getElementById('selectAll');
            const onlineStats = document.getElementById('onlineStats');
            
            if (!classGrid || !selectAll || !onlineStats) return;
            
            const checkboxes = classGrid.querySelectorAll('input[type="checkbox"]');
            const selectedClasses = Array.from(checkboxes).filter(checkbox => checkbox.checked);
            
            const allChecked = selectedClasses.length === checkboxes.length;
            const anyChecked = selectedClasses.length > 0;
            
            selectAll.checked = allChecked;
            selectAll.indeterminate = anyChecked && !allChecked;
            
            onlineStats.textContent = `已选择: ${selectedClasses.length} 个班级`;
        }

        // 获取选中的班级
        function getSelectedClasses() {
            const classGrid = document.getElementById('classGrid');
            if (!classGrid) return [];
            
            const checkboxes = classGrid.querySelectorAll('input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(checkbox => checkbox.value);
        }

        // 检查是否选择了班级
        function hasSelectedClasses() {
            return getSelectedClasses().length > 0;
        }

        // 初始化链接生成器
        function initializeLinkGenerator() {
            initializeLinkClassOptions();
            
            document.getElementById('linkGrade').addEventListener('change', function() {
                initializeLinkClassOptions();
            });
        }

        // 初始化链接生成器的班级选项
        function initializeLinkClassOptions() {
            const grade = document.getElementById('linkGrade').value;
            const classCount = gradeConfig[grade];
            const classSelect = document.getElementById('linkClass');
            
            let html = '';
            for (let i = 1; i <= classCount; i++) {
                html += `<option value="${i}">${i}班</option>`;
            }
            
            classSelect.innerHTML = html;
        }

        // 初始化科目按钮
        function initializeSubjectButtons() {
            const container = document.getElementById('subjectButtons');
            let html = '';
            
            subjects.forEach(subject => {
                const isActive = subject.id === currentSubject;
                html += `
                    <button class="subject-btn ${isActive ? 'active' : ''}" 
                            onclick="switchSubject('${subject.id}')">
                        ${subject.name}
                    </button>
                `;
            });
            
            container.innerHTML = html;
        }

        // 初始化模态框标签页
        function initializeModalTabs() {
            const tabs = document.querySelectorAll('.modal-tab');
            
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabId = this.dataset.tab;
                    
                    // 更新活动标签
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    
                    // 显示对应内容
                    document.querySelectorAll('.modal-tab-content').forEach(content => {
                        content.classList.remove('active');
                    });
                    document.getElementById(`${tabId}Tab`).classList.add('active');
                });
            });
        }

        // 生成班级链接
        function generateClassLink() {
            const grade = document.getElementById('linkGrade').value;
            const classNum = document.getElementById('linkClass').value;
            const className = `${grade}${classNum}班`;
            
            // 检查权限
            if (currentUser.role !== 'super_admin' && !userClasses.includes('all') && !userClasses.includes(className)) {
                showNotification(`您没有权限访问班级 ${className}`, 'error');
                return;
            }
            
            // 获取当前页面的基础URL
            const baseUrl = window.location.href.split('?')[0];
            const parentPage = baseUrl.replace('teacher', 'parent') || baseUrl.replace(/teacher\.html$/, 'parent.html');
            
            // 生成家长端链接
            const parentUrl = `${parentPage}?grade=${encodeURIComponent(grade)}&class=${classNum}`;
            
            // 显示生成的链接
            document.getElementById('classLinkText').textContent = parentUrl;
            document.getElementById('generatedLink').style.display = 'block';
            
            showNotification(`已生成${className}家长端链接`, 'success');
        }

        // 生成所有班级链接
        function generateAllClassLinks() {
            const baseUrl = window.location.href.split('?')[0];
            const parentPage = baseUrl.replace('teacher', 'parent') || baseUrl.replace(/teacher\.html$/, 'parent.html');
            
            let allLinks = '';
            Object.entries(gradeConfig).forEach(([grade, classCount]) => {
                allLinks += `${grade}:\n`;
                for (let i = 1; i <= classCount; i++) {
                    const className = `${grade}${i}班`;
                    
                    // 检查权限
                    if (currentUser.role === 'super_admin' || userClasses.includes('all') || userClasses.includes(className)) {
                        const link = `${parentPage}?grade=${encodeURIComponent(grade)}&class=${i}`;
                        allLinks += `${className}: ${link}\n`;
                    }
                }
                allLinks += '\n';
            });
            
            // 在新窗口中显示所有链接
            const linksWindow = window.open('', '_blank');
            linksWindow.document.write(`
                <html>
                    <head><title>所有班级链接</title></head>
                    <body style="font-family: 'Microsoft YaHei'; padding: 20px;">
                        <h1>所有班级家长端链接</h1>
                        <pre style="background: #f5f5f5; padding: 20px; border-radius: 5px; white-space: pre-wrap;">${allLinks}</pre>
                        <button onclick="window.print()">打印链接列表</button>
                    </body>
                </html>
            `);
        }

        // 复制班级链接
        function copyClassLink() {
            const linkText = document.getElementById('classLinkText').textContent;
            navigator.clipboard.writeText(linkText).then(() => {
                showNotification('链接已复制到剪贴板', 'success');
            }).catch(() => {
                // 备用方案
                const textArea = document.createElement('textarea');
                textArea.value = linkText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                showNotification('链接已复制到剪贴板', 'success');
            });
        }

        // 测试班级链接
        function testClassLink() {
            const linkText = document.getElementById('classLinkText').textContent;
            window.open(linkText, '_blank');
        }

        // 切换科目
        function switchSubject(subjectId) {
            currentSubject = subjectId;
            
            // 更新按钮状态
            document.querySelectorAll('.subject-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新编辑器标签
            document.getElementById('editorLabel').textContent = 
                `${subjectId}作业内容：`;
            
            // 加载当前科目的内容
            loadCurrentSubjectContent();
        }

        // 加载当前班级内容
        function loadCurrentClassContent() {
            // 由于现在支持多班级选择，这个函数的功能有所改变
            // 主要用来更新预览
            updatePreview();
        }

        // 加载当前科目内容到编辑器
        function loadCurrentSubjectContent() {
            // 由于现在支持多班级选择，编辑器的内容需要根据选择情况调整
            // 这里简化处理，清空编辑器
            document.getElementById('homeworkEditor').value = '';
            updatePreview();
        }

        // 从COS加载作业数据
        async function loadHomeworkData() {
            showLoading();
            updateSyncStatus('正在加载作业数据...');
            
            try {
                const response = await fetch(
                    `https://${config.bucket}.cos.${config.region}.myqcloud.com/homework_data.json?t=${Date.now()}`,
                    {
                        method: 'GET',
                        mode: 'cors',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`网络错误: ${response.status}`);
                }
                
                homeworkData = await response.json();
                updatePreview();
                updateSyncStatus('数据加载成功');
                showNotification('作业数据加载成功', 'success');
                
            } catch (error) {
                console.error('加载作业数据失败:', error);
                // 如果远程加载失败，尝试加载本地数据
                loadLocalData();
            } finally {
                hideLoading();
            }
        }

        // 加载本地数据
        function loadLocalData() {
            const localData = localStorage.getItem('homeworkData');
            if (localData) {
                homeworkData = JSON.parse(localData);
                updatePreview();
                updateSyncStatus('已加载本地备份数据');
                showNotification('已加载本地备份数据', 'warning');
            } else {
                // 初始化空数据
                homeworkData = initializeEmptyData();
                updateSyncStatus('初始化新数据');
            }
        }

        // 初始化空数据
        function initializeEmptyData() {
            const data = {};
            
            Object.keys(gradeConfig).forEach(grade => {
                data[grade] = {};
                const classCount = gradeConfig[grade];
                
                for (let i = 1; i <= classCount; i++) {
                    const classId = `${i}班`;
                    data[grade][classId] = {
                        "语文": "暂无作业",
                        "数学": "暂无作业",
                        "英语": "暂无作业",
                        "科学": "暂无作业",
                        "道法": "暂无作业",
                        "社会": "暂无作业",
                        "晨读": "暂无晨读任务",
                        "last_updated": new Date().toLocaleString('zh-CN')
                    };
                }
            });
            
            return data;
        }

        // 保存所有内容
        async function saveAll() {
            if (!homeworkData) return;
            
            const selectedClasses = getSelectedClasses();
            if (selectedClasses.length === 0) {
                showNotification('请选择要保存的班级', 'error');
                return;
            }
            
            const content = document.getElementById('homeworkEditor').value.trim();
            if (!content) {
                showNotification('请输入作业内容', 'error');
                return;
            }
            
            // 检查权限并保存到每个选中的班级
            selectedClasses.forEach(className => {
                const [grade, classNum] = parseClassName(className);
                
                // 检查权限
                if (currentUser.role !== 'super_admin' && !userClasses.includes('all') && !userClasses.includes(className)) {
                    showNotification(`您没有权限编辑班级 ${className}`, 'error');
                    return;
                }
                
                // 确保数据结构存在
                if (!homeworkData[grade]) {
                    homeworkData[grade] = {};
                }
                if (!homeworkData[grade][classNum]) {
                    homeworkData[grade][classNum] = {};
                }
                
                homeworkData[grade][classNum][currentSubject] = content || '暂无作业';
                homeworkData[grade][classNum].last_updated = new Date().toLocaleString('zh-CN');
            });
            
            updatePreview();
            
            // 先保存到本地
            localStorage.setItem('homeworkData', JSON.stringify(homeworkData));
            
            // 然后尝试上传到云端
            updateSyncStatus('正在上传到云端...');
            
            try {
                const result = await uploadToCOS(homeworkData);
                
                if (result.success) {
                    updateSyncStatus('云端保存成功');
                    showNotification(`作业已保存到 ${selectedClasses.length} 个班级的本地和云端！`, 'success');
                } else {
                    updateSyncStatus('云端保存失败，已保存到本地');
                    showNotification('作业已保存到本地，但云端上传失败: ' + result.message, 'warning');
                }
            } catch (error) {
                updateSyncStatus('云端保存失败，已保存到本地');
                showNotification('作业已保存到本地，但云端上传失败: ' + error.message, 'warning');
            }
        }

        // 解析班级名称
        function parseClassName(className) {
            const grade = className.substring(0, 2); // 初一、初二、初三
            const classNum = className.substring(2); // 1班、2班等
            return [grade, classNum];
        }

        // 保存当前科目
        async function saveCurrent() {
            await saveAll(); // 现在saveAll已经支持多班级，可以直接使用
        }

        // 复制到同年级所有班级
        function copyToAllClasses() {
            if (!homeworkData) return;
            
            const content = document.getElementById('homeworkEditor').value.trim();
            if (!content) {
                showNotification('请输入作业内容', 'error');
                return;
            }
            
            const selectedClasses = getSelectedClasses();
            if (selectedClasses.length === 0) {
                showNotification('请先选择源班级', 'error');
                return;
            }
            
            // 获取第一个选中班级的年级
            const firstClass = selectedClasses[0];
            const [grade] = parseClassName(firstClass);
            const classCount = gradeConfig[grade];
            
            if (confirm(`确定要将当前内容复制到${grade}所有${classCount}个班级吗？`)) {
                for (let i = 1; i <= classCount; i++) {
                    const classId = `${i}班`;
                    const className = `${grade}${classId}`;
                    
                    // 检查权限
                    if (currentUser.role !== 'super_admin' && !userClasses.includes('all') && !userClasses.includes(className)) {
                        continue; // 跳过没有权限的班级
                    }
                    
                    // 确保数据结构存在
                    if (!homeworkData[grade][classId]) {
                        homeworkData[grade][classId] = {};
                    }
                    
                    homeworkData[grade][classId][currentSubject] = content || '暂无作业';
                    homeworkData[grade][classId].last_updated = new Date().toLocaleString('zh-CN');
                }
                
                updatePreview();
                showNotification(`已成功复制到${grade}所有${classCount}个班级`, 'success');
            }
        }

        // 上传到腾讯云COS
        async function uploadToCOS(data) {
            const jsonData = JSON.stringify(data, null, 2);
            
            try {
                console.log('开始直接上传到COS...');
                
                // 方法1: 直接PUT请求
                const response = await fetch(
                    `https://${config.bucket}.cos.${config.region}.myqcloud.com/homework_data.json`,
                    {
                        method: 'PUT',
                        mode: 'cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: jsonData
                    }
                );
                
                console.log('直接上传响应状态:', response.status);
                
                if (response.ok) {
                    return { success: true, message: '直接上传成功' };
                } else {
                    return { success: false, message: `上传失败: ${response.status}` };
                }
            } catch (error) {
                console.error('直接上传错误:', error);
                return { success: false, message: error.message };
            }
        }

        // 清空当前科目
        function clearCurrent() {
            if (confirm(`确定要清空${currentSubject}科目的作业内容吗？`)) {
                document.getElementById('homeworkEditor').value = '';
                showNotification(`${currentSubject}内容已清空`, 'warning');
            }
        }

        // 更新预览
        function updatePreview() {
            if (!homeworkData) return;
            
            const container = document.getElementById('previewContainer');
            const selectedClasses = getSelectedClasses();
            
            let html = '';
            
            if (selectedClasses.length === 0) {
                html = '<div class="empty-preview">请选择班级查看作业预览</div>';
            } else {
                selectedClasses.forEach(className => {
                    const [grade, classNum] = parseClassName(className);
                    
                    if (homeworkData[grade] && homeworkData[grade][classNum]) {
                        const classData = homeworkData[grade][classNum];
                        
                        subjects.forEach(subject => {
                            const content = classData[subject.id] || '暂无内容';
                            const isEmpty = !content || content === '暂无作业' || content === '暂无晨读任务';
                            
                            html += `
                                <div class="preview-card">
                                    <div class="preview-header">
                                        <h3>${subject.name}</h3>
                                        <span class="preview-class">${className}</span>
                                    </div>
                                    <div class="preview-content">
                                        ${isEmpty ? 
                                            `<div class="empty-preview">${subject.id === '晨读' ? '暂无晨读任务' : '暂无作业'}</div>` :
                                            `<div class="preview-text">${escapeHtml(content)}</div>`
                                        }
                                    </div>
                                </div>
                            `;
                        });
                    } else {
                        html += `<div class="empty-preview">${className}暂无数据</div>`;
                    }
                });
            }
            
            container.innerHTML = html;
            
            // 更新最后更新时间
            if (selectedClasses.length > 0) {
                const firstClass = selectedClasses[0];
                const [grade, classNum] = parseClassName(firstClass);
                
                if (homeworkData[grade] && homeworkData[grade][classNum]) {
                    document.getElementById('lastUpdated').textContent = 
                        `最后更新: ${homeworkData[grade][classNum].last_updated || '未知时间'}`;
                } else {
                    document.getElementById('lastUpdated').textContent = '最后更新: 未知时间';
                }
            } else {
                document.getElementById('lastUpdated').textContent = '最后更新: 请选择班级';
            }
        }

        // 配置相关功能
        function loadConfig() {
            const savedConfig = localStorage.getItem('cosConfig');
            if (savedConfig) {
                config = { ...config, ...JSON.parse(savedConfig) };
            }
        }

        function saveConfig() {
            config.secretId = document.getElementById('secretId').value;
            config.secretKey = document.getElementById('secretKey').value;
            
            localStorage.setItem('cosConfig', JSON.stringify(config));
            hideConfigModal();
            showNotification('配置已保存', 'success');
        }

        function showConfigModal() {
            document.getElementById('secretId').value = config.secretId;
            document.getElementById('secretKey').value = config.secretKey;
            document.getElementById('configModal').classList.add('show');
        }

        function hideConfigModal() {
            document.getElementById('configModal').classList.remove('show');
        }

        async function testConnection() {
            try {
                showNotification('正在测试连接...', 'warning');
                
                const response = await fetch(
                    `https://${config.bucket}.cos.${config.region}.myqcloud.com/homework_data.json`,
                    {
                        method: 'HEAD',
                        mode: 'cors'
                    }
                );
                
                if (response.status === 200 || response.status === 404) {
                    showNotification('连接测试成功！存储桶可访问', 'success');
                } else {
                    showNotification(`连接测试失败: ${response.status}`, 'error');
                }
            } catch (error) {
                showNotification('连接测试失败: ' + error.message, 'error');
            }
        }

        // 工具函数
        function showLoading() {
            updateSyncStatus('加载中...');
        }

        function hideLoading() {
            // 状态会在具体操作中更新
        }

        function updateSyncStatus(message) {
            document.getElementById('syncStatus').textContent = message;
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = 'notification';
            notification.classList.add(type);
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 4000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 键盘快捷键
        document.addEventListener('keydown', function(event) {
            if ((event.ctrlKey || event.metaKey) && event.key === 's') {
                event.preventDefault();
                saveAll();
            }
        });

        // 添加调试信息
        console.log('作业管理系统已初始化完成');
        console.log('当前用户:', currentUser);
        console.log('用户权限班级:', userClasses);
    </script>
</body>
</html>
